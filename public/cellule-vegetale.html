<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellule végétale 3D</title>
<meta name="description" content="Modele 3D interactif de la cellule vegetale : cellule, chloroplaste, membrane thylakoidale.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#120720;overflow:hidden}
*{box-sizing:border-box}
a{color:#5eead4;text-decoration:none}
a:hover{color:#8ff5e0}
@keyframes cardIn{from{opacity:0}to{opacity:1}}
@keyframes odRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- Glissieres : design repris tel quel de la cellule animale (index.html) ------
   Meme piste arrondie, meme pouce carre a trois barres, meme accent turquoise.
   La variante .vert sert au reglage de coupe attache aux fiches.                  */
.dslider { position:relative; height:30px; margin-top:8px; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
.dslider .dtrack { position:absolute; left:0; right:0; top:2px; height:26px; border-radius:10px; background:rgba(159,179,198,.16); overflow:hidden; }
.dslider .dfill { position:absolute; left:0; top:0; bottom:0; border-radius:10px; width:0%;
  background:linear-gradient(90deg, rgba(127,227,210,.45), #7fe3d2); }
.dslider .dthumb { position:absolute; top:0; left:0%; width:30px; height:30px; margin-left:-15px; border-radius:9px;
  background:#eaf6f2; border:1px solid #7fe3d2; box-shadow:0 5px 14px -4px rgba(0,0,0,.55), 0 0 0 4px rgba(127,227,210,.14);
  display:flex; align-items:center; justify-content:center; pointer-events:none; }
.dslider .dthumb i { width:2px; height:12px; border-radius:2px; background:rgba(12,26,40,.32);
  box-shadow:5px 0 0 rgba(12,26,40,.32), -5px 0 0 rgba(12,26,40,.32); }
.dslider.vert { height:auto; margin-top:0; width:30px; }
.dslider.vert .dtrack { left:2px; right:2px; top:0; bottom:0; width:auto; height:auto; }
.dslider.vert .dfill { left:0; right:0; top:auto; bottom:0; width:auto; height:0%;
  background:linear-gradient(0deg, rgba(127,227,210,.45), #7fe3d2); }
.dslider.vert .dthumb { top:auto; bottom:0%; left:50%; margin-left:-15px; margin-bottom:-15px; }
.dslider.vert .dthumb i { width:12px; height:2px;
  box-shadow:0 5px 0 rgba(12,26,40,.32), 0 -5px 0 rgba(12,26,40,.32); }

/* Colonne de coupe attachee au flanc droit d'une fiche */
.pcut { position:absolute; left:100%; top:0; bottom:0; margin-left:7px; width:46px;
  border-radius:13px; background:rgba(15,26,38,.94); border:1px solid rgba(127,227,210,.24);
  box-shadow:0 14px 40px rgba(0,0,0,.5);
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 9px; }
.pcut-cap { font-family:'IBM Plex Mono',monospace; font-size:8px; line-height:1.2; letter-spacing:.06em;
  text-transform:uppercase; text-align:center; color:rgba(127,227,210,.82); padding:0 3px; }
.pcut-ico { font-size:12px; line-height:1; color:rgba(127,227,210,.75); }
.pcut-val { font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.02em; color:#7fe3d2; }
.pcut-slider { flex:1 1 auto; min-height:92px; }
</style>
</style>
<!-- three servi en local, comme la page musculaire : la page doit marcher hors-ligne.
     public/ n'est pas traite par Vite, d'ou l'import map plutot qu'un bundle. -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>

<div id="root"></div>

<!-- Gabarit declaratif, repris de l'export Claude Design. Les formes utilisees
     ({{ }}, sc-if, sc-for, ref, sc-camel-on-*) sont interpretees par ./vendor/dc-runtime.js,
     qui remplace le support.js non distribuable. Cette page n'est plus un bundle. -->
<template id="tpl">
<div ref="{{ rootRef }}" style="position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(115% 95% at 60% 42%, #2c1546 0%, #1c0d2e 46%, #110620 100%);color:#e9e3f2;font-family:'IBM Plex Sans',system-ui,sans-serif;user-select:none">

  <div data-cell-host="1" ref="{{ hostRef }}" style="position:absolute;inset:0;z-index:1;cursor:grab"></div>
  <div data-cell-fade="1" ref="{{ fadeRef }}" style="position:absolute;inset:0;z-index:3;background:#150a24;opacity:0;pointer-events:none;transition:opacity .2s linear"></div>

  <div style="position:absolute;top:20px;left:22px;z-index:4;display:flex;align-items:center;gap:14px;padding:11px 16px 12px;border:1px solid rgba(150,220,205,.16);border-radius:9px;background:rgba(16,10,26,.5);backdrop-filter:blur(8px)">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#d7f3ea">{{ levelName }}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(233,227,242,.42)">{{ levelSize }}</div>
    </div>
    <div style="width:5px;height:5px;border-radius:50%;background:#5eead4;box-shadow:0 0 10px rgba(94,234,212,.7)"></div>
  </div>

  <div style="position:absolute;left:0;top:0;bottom:0;width:420px;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(15,7,26,.92) 0%,rgba(15,7,26,.86) 40%,rgba(15,7,26,.5) 72%,rgba(15,7,26,0) 100%)"></div>

  <div style="position:absolute;left:32px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;gap:0">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(233,227,242,.34);margin-bottom:34px">Profondeur d'exploration</div>
    <div style="position:relative;display:flex;flex-direction:column;gap:44px">
      <div style="position:absolute;left:5px;top:9px;bottom:9px;width:1px;background:linear-gradient(180deg,rgba(94,234,212,.55),rgba(94,234,212,.10))"></div>

      <div sc-camel-on-click="{{ goL1 }}" style="display:flex;align-items:flex-start;gap:22px;cursor:pointer;pointer-events:auto;position:relative">
        <div style="width:11px;height:11px;border-radius:50%;margin-top:9px;flex:none;background:{{ d1bg }};border:1px solid {{ d1br }};box-shadow:{{ d1sh }}"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:300;color:{{ n1 }};letter-spacing:.04em;padding-top:2px">01</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:Spectral,Georgia,serif;font-size:22px;font-weight:400;letter-spacing:.005em;color:{{ t1 }}">Cellule végétale</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:{{ s1 }}">≈ 50 µm</div>
        </div>
      </div>

      <div sc-camel-on-click="{{ goL2 }}" style="display:flex;align-items:flex-start;gap:22px;cursor:pointer;pointer-events:auto;position:relative">
        <div style="width:11px;height:11px;border-radius:50%;margin-top:9px;flex:none;background:{{ d2bg }};border:1px solid {{ d2br }};box-shadow:{{ d2sh }}"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:300;color:{{ n2 }};letter-spacing:.04em;padding-top:2px">02</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:Spectral,Georgia,serif;font-size:22px;font-weight:400;letter-spacing:.005em;color:{{ t2 }}">Chloroplaste</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:{{ s2 }}">≈ 5 µm</div>
        </div>
      </div>

      <div sc-camel-on-click="{{ goL3 }}" style="display:flex;align-items:flex-start;gap:22px;cursor:pointer;pointer-events:auto;position:relative">
        <div style="width:11px;height:11px;border-radius:50%;margin-top:9px;flex:none;background:{{ d3bg }};border:1px solid {{ d3br }};box-shadow:{{ d3sh }}"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:300;color:{{ n3 }};letter-spacing:.04em;padding-top:2px">03</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:Spectral,Georgia,serif;font-size:22px;font-weight:400;letter-spacing:.005em;color:{{ t3 }}">Membrane thylakoïdale</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:{{ s3 }}">≈ 20 nm</div>
        </div>
      </div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:rgba(233,227,242,.28);margin-top:34px">↓&nbsp;&nbsp;cliquez une strate pour plonger &middot; un organite pour l'inspecter · glissez pour orbiter</div>
  </div>

  <!-- HUD des coins — maquette « Cellule » : trois boutons carrés (↻ rotation ·
       ◑ coupe · ↔ écartement), le corps du réglage tombe dessous, puis le bouton
       ambre de l'atlas. Même registre que la cellule animale. -->
  <div style="position:absolute;top:44px;right:44px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:7px">
    <div style="display:flex;gap:7px">
      <div sc-camel-on-click="{{ tRot }}" title="Rotation automatique" style="width:30px;height:30px;border-radius:9px;background:{{ rotBtnBg }};border:1px solid {{ rotBtnBr }};display:grid;place-items:center;font:400 12px/1.3 'IBM Plex Mono',monospace;color:{{ rotBtnFg }};cursor:pointer;transition:background .18s,border-color .18s,color .16s">↻</div>
      <div sc-camel-on-click="{{ tCut }}" title="Coupe du modèle" style="width:30px;height:30px;border-radius:9px;background:{{ cutBtnBg }};border:1px solid {{ cutBtnBr }};display:grid;place-items:center;font:400 12px/1.3 'IBM Plex Mono',monospace;color:{{ cutBtnFg }};cursor:pointer;transition:background .18s,border-color .18s,color .16s">◑</div>
      <div sc-camel-on-click="{{ tSpread }}" title="Écartement des organites" style="width:30px;height:30px;border-radius:9px;background:{{ spBtnBg }};border:1px solid {{ spBtnBr }};display:grid;place-items:center;font:400 12px/1.3 'IBM Plex Mono',monospace;color:{{ spBtnFg }};cursor:pointer;transition:background .18s,border-color .18s,color .16s">↔</div>
    </div>
    <div style="font:400 9.5px/1.3 'IBM Plex Mono',monospace;color:rgba(160,200,220,.35)">R · C · É</div>
    <div style="margin-top:6px;padding:9px 14px;border-radius:9px;background:rgba(240,163,94,.16);border:1px solid rgba(240,163,94,.36);backdrop-filter:blur(14px);font:500 11.5px/1.2 'IBM Plex Sans',system-ui,sans-serif;color:#f5c295;cursor:pointer">Atlas de la photosynthèse ↗</div>

    <sc-if value="{{ showRot }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px;width:300px;padding:14px 15px;border-radius:13px;background:rgba(15,26,38,.9);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.35);animation:odRise .42s cubic-bezier(.22,.9,.24,1) both">
        <div style="display:flex;align-items:center;gap:12px">
          <div sc-camel-on-click="{{ toggleRot }}" style="width:34px;height:18px;border-radius:9px;position:relative;cursor:pointer;flex:none;background:{{ rotTrack }};transition:background .2s">
            <div style="position:absolute;top:2px;left:{{ rotKnob }};width:14px;height:14px;border-radius:50%;background:#eaf7f3;transition:left .18s ease"></div>
          </div>
          <div class="dslider" sc-camel-on-pointer-down="{{ onRotSlide }}" style="flex:1;margin-top:0">
            <div class="dtrack"><div class="dfill" style="width:{{ rotPct }}"></div></div>
            <div class="dthumb" style="left:{{ rotPct }}"><i></i></div>
          </div>
          <div style="font:400 11px/1.3 'IBM Plex Mono',monospace;color:rgba(233,227,242,.5);width:34px;text-align:right">{{ rotLabel }}</div>
        </div>
        <div sc-camel-on-click="{{ reset }}" style="margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font:400 11px/1.3 'IBM Plex Mono',monospace;color:rgba(168,242,226,.75);cursor:pointer">↻&nbsp;&nbsp;réinitialiser la vue</div>
      </div>
    </sc-if>

    <sc-if value="{{ showCut }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px;width:300px;padding:14px 15px;border-radius:13px;background:rgba(15,26,38,.9);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.35);animation:odRise .42s cubic-bezier(.22,.9,.24,1) both;display:flex;align-items:center;gap:12px">
        <div style="font:400 9.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(233,227,242,.36);width:64px">profondeur</div>
        <div class="dslider" sc-camel-on-pointer-down="{{ onCutSlide }}" style="flex:1;margin-top:0">
            <div class="dtrack"><div class="dfill" style="width:{{ cutPct }}"></div></div>
            <div class="dthumb" style="left:{{ cutPct }}"><i></i></div>
          </div>
        <div style="font:400 11px/1.3 'IBM Plex Mono',monospace;color:rgba(233,227,242,.5);width:44px;text-align:right">{{ cutLabel }}</div>
      </div>
    </sc-if>
    <sc-if value="{{ showSpread }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px;width:300px;padding:14px 15px;border-radius:13px;background:rgba(15,26,38,.9);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.35);animation:odRise .42s cubic-bezier(.22,.9,.24,1) both;display:flex;gap:8px">
        <div sc-camel-on-click="{{ setCompact }}" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;cursor:pointer;font:400 10.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;background:{{ cpBg }};border:1px solid {{ cpBr }};color:{{ cpFg }}">compact</div>
        <div sc-camel-on-click="{{ setExploded }}" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;cursor:pointer;font:400 10.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;background:{{ exBg }};border:1px solid {{ exBr }};color:{{ exFg }}">éclaté</div>
      </div>
    </sc-if>
  </div>

  <sc-for list="{{ cards }}" as="card" hint-placeholder-count="0">
    <!-- Pas de backdrop-filter : la fiche est repositionnee a chaque image, et
         reechantillonner un flou d'arriere-plan a chaque fois la faisait scintiller
         pendant la rotation. Un fond opaque rend le meme service sans l'artefact. -->
    <div data-card-id="{{ card.id }}" style="position:absolute;left:0;top:0;z-index:5;width:252px;padding:12px 14px 13px;border-radius:9px;background:rgba(13,10,21,.96);border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 60px rgba(0,0,0,.55);animation:cardIn .22s ease both">
      <div style="display:flex;align-items:center;gap:9px">
        <div style="width:8px;height:8px;border-radius:50%;flex:none;background:{{ card.dot }}"></div>
        <div style="flex:1;font-size:13.5px;font-weight:600;color:#f2eef8">{{ card.name }}</div>
        <div sc-camel-on-click="{{ card.close }}" style="width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(233,227,242,.45);font-size:13px">×</div>
      </div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;color:rgba(233,227,242,.42);margin:3px 0 11px 17px">{{ card.sub }}</div>
      <div style="display:grid;grid-template-columns:92px 1fr;gap:7px 12px">
        <sc-for list="{{ card.rows }}" as="row" hint-placeholder-count="3">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:rgba(233,227,242,.4);line-height:1.5">{{ row.k }}</div>
          <div style="font-size:11.5px;color:rgba(242,238,248,.88);line-height:1.45">{{ row.v }}</div>
        </sc-for>
      </div>
      <!-- Reglage de fermeture attache a la fiche, exactement comme dans la cellule
           animale : une colonne verticale au flanc droit, pas une barre dans le corps
           de la fiche. Seules la membrane et l'enveloppe nucleaire en portent une. -->
      <sc-if value="{{ card.hasCut }}" hint-placeholder-val="{{ false }}">
        <div class="pcut">
          <span class="pcut-cap">Fermeture<br>{{ card.cutWhat }}</span>
          <span class="pcut-val">{{ card.cutVal }}</span>
          <div class="dslider vert pcut-slider" sc-camel-on-pointer-down="{{ card.onCut }}">
            <div class="dtrack"><div class="dfill" style="height:{{ card.cutPct }}"></div></div>
            <div class="dthumb" style="bottom:{{ card.cutPct }}"><i></i></div>
          </div>
          <span class="pcut-ico">&#9683;</span>
        </div>
      </sc-if>
    </div>
  </sc-for>

  <div data-cell-tip="1" ref="{{ tipRef }}" style="position:absolute;left:0;top:0;z-index:6;transform:translate(-9999px,-9999px);pointer-events:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#dbf7ee;background:rgba(9,7,15,.82);border:1px solid rgba(94,234,212,.26);padding:5px 9px;border-radius:5px;white-space:nowrap"></div>

  <!-- Panneau des organites (maquette « Cellule ») — fermé par défaut : la poignée
       annonce ce qu'elle contient et invite à la tirer vers le haut. L'ouverture
       déplie la hauteur (grid-template-rows 0fr → 1fr) pendant que la poignée
       s'élargit et que le contenu monte en cascade. Identique à la cellule animale. -->
  <div style="position:absolute;left:50%;bottom:0;z-index:7;width:{{ odWidth }};padding:0 22px {{ odPadBottom }};border-radius:16px 16px 0 0;background:rgba(9,22,31,.94);border:1px solid rgba(255,255,255,.15);border-bottom:none;backdrop-filter:blur(18px);box-shadow:{{ odShadow }};display:flex;flex-direction:column;transform:translate(-50%,0);transition:width .52s cubic-bezier(.22,.9,.24,1), padding-bottom .52s cubic-bezier(.22,.9,.24,1), box-shadow .3s ease">
    <div sc-camel-on-click="{{ odToggle }}" style="display:flex;flex-direction:column;align-items:stretch;gap:12px;width:100%;padding:14px 4px 4px;cursor:pointer">
      <div style="align-self:center;width:52px;height:4px;flex:none;border-radius:2px;background:rgba(140,195,220,.35)"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 12px {{ odRowPadBottom }};overflow:hidden;max-height:{{ odRowMax }};opacity:{{ odTxOp }};transition:max-height .52s cubic-bezier(.22,.9,.24,1), opacity .22s ease, padding .52s cubic-bezier(.22,.9,.24,1)">
        <div style="font:400 16.5px/1.25 Spectral,Georgia,serif;letter-spacing:.004em;color:rgba(226,240,248,.92)">Voir les organites {{ odScope }}</div>
        <div style="font:500 14px/1 'IBM Plex Mono',ui-monospace,monospace;color:#6ee7cf;flex:none">↑</div>
      </div>
    </div>
    <div style="display:grid;grid-template-rows:{{ odRows }};transition:grid-template-rows .52s cubic-bezier(.22,.9,.24,1)">
      <div style="min-height:0;overflow:hidden">
        <div style="display:flex;flex-direction:column;gap:12px;padding-top:2px;opacity:{{ odInnerOp }};transition:opacity .22s ease">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
            <div style="font:400 9px/1.3 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(160,200,220,.6)">Organites {{ odScope }}</div>
            <div style="font:400 9.5px/1.3 'IBM Plex Mono',ui-monospace,monospace;color:rgba(160,200,220,.4)">cliquer = isoler</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <sc-for list="{{ odFams }}" as="fam" hint-placeholder-count="3">
              <div sc-camel-on-click="{{ fam.pick }}" style="padding:6px 11px;border-radius:12px;cursor:pointer;background:{{ fam.bg }};border:1px solid {{ fam.br }};font:500 11px/1.2 'IBM Plex Sans',system-ui,sans-serif;color:{{ fam.fg }};display:flex;align-items:center;gap:7px;white-space:nowrap;animation:odRise .46s cubic-bezier(.22,.9,.24,1) both;animation-delay:{{ fam.delay }};transition:background .18s,border-color .18s,color .16s">
                <div style="width:7px;height:7px;border-radius:50%;flex:none;background:{{ fam.dot }}"></div>
                <div>{{ fam.name }}</div>
              </div>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:8px">
            <sc-for list="{{ odItems }}" as="org" hint-placeholder-count="3">
              <div sc-camel-on-click="{{ org.pick }}" style="padding:10px 11px;border-radius:9px;cursor:pointer;background:{{ org.bg }};border:1px solid rgba(140,195,220,.14);display:flex;flex-direction:column;gap:4px;animation:odRise .46s cubic-bezier(.22,.9,.24,1) both;animation-delay:{{ org.delay }};transition:background .18s,border-color .18s">
                <div style="display:flex;align-items:center;gap:6px">
                  <div style="width:7px;height:7px;border-radius:50%;flex:none;background:{{ org.dot }}"></div>
                  <div style="font:500 11.5px/1.2 'IBM Plex Sans',system-ui,sans-serif;color:#eef4fa">{{ org.name }}</div>
                </div>
                <div style="font:400 10.5px/1.35 'IBM Plex Mono',ui-monospace,monospace;color:rgba(214,235,246,.7)">{{ org.sub }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;right:22px;bottom:24px;z-index:4;display:flex;align-items:baseline;gap:8px">

  rnd() { this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff; return this.seed / 0x7fffffff; }
  rr(a, b) { return a + (b - a) * this.rnd(); }

  sync() {
    const o = this.S.owner;
