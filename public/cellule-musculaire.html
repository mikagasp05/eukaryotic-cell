<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellule musculaire 3D</title>
<meta name="description" content="Modele 3D interactif de la fibre musculaire : fibre, sarcomere, ponts d'union.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#150c11;overflow:hidden}
*{box-sizing:border-box}
a{color:#f0a273;text-decoration:none}
a:hover{color:#ffc9a8}
@keyframes cardIn{from{opacity:0}to{opacity:1}}

/* --- Glissieres : meme design que la cellule animale (index.html), decline dans
   l'orange de la fibre. Meme piste arrondie, meme pouce carre a trois barres.    */
.dslider { position:relative; height:30px; margin-top:8px; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
.dslider .dtrack { position:absolute; left:0; right:0; top:2px; height:26px; border-radius:10px; background:rgba(198,179,168,.16); overflow:hidden; }
.dslider .dfill { position:absolute; left:0; top:0; bottom:0; border-radius:10px; width:0%;
  background:linear-gradient(90deg, rgba(240,162,115,.45), #f0a273); }
.dslider .dthumb { position:absolute; top:0; left:0%; width:30px; height:30px; margin-left:-15px; border-radius:9px;
  background:#f9ece7; border:1px solid #f0a273; box-shadow:0 5px 14px -4px rgba(0,0,0,.55), 0 0 0 4px rgba(240,162,115,.14);
  display:flex; align-items:center; justify-content:center; pointer-events:none; }
.dslider .dthumb i { width:2px; height:12px; border-radius:2px; background:rgba(40,22,28,.32);
  box-shadow:5px 0 0 rgba(40,22,28,.32), -5px 0 0 rgba(40,22,28,.32); }
</style>
<!-- three est servi en local (pas de CDN) : la page doit marcher hors-ligne comme le reste
     du site. public/ n'est pas traite par Vite, d'ou l'import map plutot qu'un bundle. -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>

<div id="root"></div>

<!-- Gabarit declaratif, repris tel quel de l'export Claude Design.
     Les formes utilisees ({{ }}, sc-if, sc-for, ref, onClick) sont interpretees
     par ./vendor/dc-runtime.js, qui remplace le support.js non distribuable. -->
<template id="tpl">
<div ref="{{ rootRef }}" style="position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(115% 95% at 60% 42%, #40202a 0%, #27131b 46%, #150c11 100%);color:#f4e7e3;font-family:'IBM Plex Sans',system-ui,sans-serif;user-select:none">

  <div data-mus-host="1" ref="{{ hostRef }}" style="position:absolute;inset:0;z-index:1;cursor:grab"></div>
  <div data-mus-fade="1" ref="{{ fadeRef }}" style="position:absolute;inset:0;z-index:3;background:#1c1015;opacity:0;pointer-events:none;transition:opacity .2s linear"></div>

  <div style="position:absolute;top:20px;left:22px;z-index:4;display:flex;align-items:center;gap:14px;padding:11px 16px 12px;border:1px solid rgba(220,170,140,.18);border-radius:9px;background:rgba(28,15,20,.5);backdrop-filter:blur(8px)">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#f7e2d4">{{ levelName }}</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(244,231,227,.42)">{{ levelSize }}</div>
    </div>
    <div style="width:5px;height:5px;border-radius:50%;background:#f0a273;box-shadow:0 0 10px rgba(240,162,115,.7)"></div>
  </div>

  <div style="position:absolute;left:0;top:0;bottom:0;width:420px;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(19,10,14,.92) 0%,rgba(19,10,14,.86) 40%,rgba(19,10,14,.5) 72%,rgba(19,10,14,0) 100%)"></div>

  <div style="position:absolute;left:32px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;align-items:flex-start;pointer-events:none;gap:0">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:rgba(244,231,227,.34);margin-bottom:34px">Profondeur d'exploration</div>
    <div style="position:relative;display:flex;flex-direction:column;gap:44px">
      <div style="position:absolute;left:5px;top:9px;bottom:9px;width:1px;background:linear-gradient(180deg,rgba(240,162,115,.55),rgba(240,162,115,.10))"></div>

      <div onClick="{{ goL1 }}" style="display:flex;align-items:flex-start;gap:22px;cursor:pointer;pointer-events:auto;position:relative">
        <div style="width:11px;height:11px;border-radius:50%;margin-top:9px;flex:none;background:{{ d1bg }};border:1px solid {{ d1br }};box-shadow:{{ d1sh }}"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:300;color:{{ n1 }};letter-spacing:.04em;padding-top:2px">01</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:Spectral,Georgia,serif;font-size:22px;font-weight:400;letter-spacing:.005em;color:{{ t1 }}">Fibre musculaire</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:{{ s1 }}">≈ 50 µm</div>
        </div>
      </div>

      <div onClick="{{ goL2 }}" style="display:flex;align-items:flex-start;gap:22px;cursor:pointer;pointer-events:auto;position:relative">
        <div style="width:11px;height:11px;border-radius:50%;margin-top:9px;flex:none;background:{{ d2bg }};border:1px solid {{ d2br }};box-shadow:{{ d2sh }}"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:300;color:{{ n2 }};letter-spacing:.04em;padding-top:2px">02</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:Spectral,Georgia,serif;font-size:22px;font-weight:400;color:{{ t2 }}">Sarcomère</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:{{ s2 }}">≈ 2 µm</div>
        </div>
      </div>

      <div onClick="{{ goL3 }}" style="display:flex;align-items:flex-start;gap:22px;cursor:pointer;pointer-events:auto;position:relative">
        <div style="width:11px;height:11px;border-radius:50%;margin-top:9px;flex:none;background:{{ d3bg }};border:1px solid {{ d3br }};box-shadow:{{ d3sh }}"></div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:300;color:{{ n3 }};letter-spacing:.04em;padding-top:2px">03</div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="font-family:Spectral,Georgia,serif;font-size:22px;font-weight:400;color:{{ t3 }}">Ponts d'union</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:{{ s3 }}">≈ 10 nm</div>
        </div>
      </div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:rgba(244,231,227,.28);margin-top:34px">↓&nbsp;&nbsp;molette ou &#8593;&#8595; pour plonger &middot; glissez pour orbiter</div>
  </div>

  <!-- HUD des coins — meme registre que la cellule vegetale : trois boutons carres
       (R rotation, C coupe, E ecartement), le corps du reglage tombe dessous.
       Palette rouge/orangee de la fibre, la ou la vegetale est turquoise. -->
  <div style="position:absolute;top:44px;right:44px;z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:7px">
    <div style="display:flex;align-items:center;gap:7px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,231,227,.42);margin-right:4px">{{ levelTag }}</div>
      <div onClick="{{ tRot }}" title="Rotation automatique" style="width:30px;height:30px;border-radius:9px;background:{{ rotBtnBg }};border:1px solid {{ rotBtnBr }};display:grid;place-items:center;font:400 12px/1.3 'IBM Plex Mono',monospace;color:{{ rotBtnFg }};cursor:pointer;backdrop-filter:blur(10px)">&#8635;</div>
      <div onClick="{{ tCut }}" title="Coupe du modele" style="width:30px;height:30px;border-radius:9px;background:{{ cutBtnBg }};border:1px solid {{ cutBtnBr }};display:grid;place-items:center;font:400 12px/1.3 'IBM Plex Mono',monospace;color:{{ cutBtnFg }};cursor:pointer;backdrop-filter:blur(10px)">&#9681;</div>
      <div onClick="{{ tSpread }}" title="Ecartement des organites" style="width:30px;height:30px;border-radius:9px;background:{{ spBtnBg }};border:1px solid {{ spBtnBr }};display:grid;place-items:center;font:400 12px/1.3 'IBM Plex Mono',monospace;color:{{ spBtnFg }};cursor:pointer;backdrop-filter:blur(10px)">&#8596;</div>
    </div>
    <div style="font:400 9.5px/1.3 'IBM Plex Mono',monospace;color:rgba(244,231,227,.3)">R &middot; C &middot; E</div>

    <sc-if value="{{ showRot }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px;width:300px;padding:14px 15px;border-radius:13px;background:rgba(34,18,24,.9);border:1px solid rgba(220,170,140,.2);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.4)">
        <div style="display:flex;align-items:center;gap:12px">
          <div onClick="{{ toggleRot }}" style="width:34px;height:18px;border-radius:9px;position:relative;cursor:pointer;flex:none;background:{{ rotTrack }};transition:background .2s">
            <div style="position:absolute;top:2px;left:{{ rotKnob }};width:14px;height:14px;border-radius:50%;background:#f9ece7;transition:left .18s ease"></div>
          </div>
          <div class="dslider" onPointerDown="{{ onRotSlide }}" style="flex:1;margin-top:0">
            <div class="dtrack"><div class="dfill" style="width:{{ rotPct }}"></div></div>
            <div class="dthumb" style="left:{{ rotPct }}"><i></i></div>
          </div>
          <div style="font:400 11px/1.3 'IBM Plex Mono',monospace;color:rgba(244,231,227,.5);width:34px;text-align:right">{{ rotLabel }}</div>
        </div>
        <div onClick="{{ reset }}" style="margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font:400 11px/1.3 'IBM Plex Mono',monospace;color:rgba(242,179,137,.8);cursor:pointer">&#8635;&nbsp;&nbsp;reinitialiser la vue</div>
      </div>
    </sc-if>

    <sc-if value="{{ showCut }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px;width:300px;padding:14px 15px;border-radius:13px;background:rgba(34,18,24,.9);border:1px solid rgba(220,170,140,.2);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px">
        <div style="font:400 9.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,231,227,.36);width:64px">profondeur</div>
        <div class="dslider" onPointerDown="{{ onCutSlide }}" style="flex:1;margin-top:0">
            <div class="dtrack"><div class="dfill" style="width:{{ cutPct }}"></div></div>
            <div class="dthumb" style="left:{{ cutPct }}"><i></i></div>
          </div>
        <div style="font:400 11px/1.3 'IBM Plex Mono',monospace;color:rgba(244,231,227,.5);width:44px;text-align:right">{{ cutLabel }}</div>
      </div>
    </sc-if>

    <sc-if value="{{ showSpread }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:6px;width:300px;padding:14px 15px;border-radius:13px;background:rgba(34,18,24,.9);border:1px solid rgba(220,170,140,.2);backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;gap:9px">
        <div onClick="{{ setCompact }}" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;cursor:pointer;font:400 10.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;background:{{ cpBg }};border:1px solid {{ cpBr }};color:{{ cpFg }}">compact</div>
        <div onClick="{{ setExploded }}" style="flex:1;text-align:center;padding:8px 0;border-radius:9px;cursor:pointer;font:400 10.5px/1.3 'IBM Plex Mono',monospace;letter-spacing:.12em;background:{{ exBg }};border:1px solid {{ exBr }};color:{{ exFg }}">eclate</div>
      </div>
    </sc-if>
  </div>

  <div data-mus-tip="1" ref="{{ tipRef }}" style="position:absolute;left:0;top:0;z-index:6;transform:translate(-9999px,-9999px);pointer-events:none;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#fbe6d8;background:rgba(15,8,11,.82);border:1px solid rgba(240,162,115,.28);padding:5px 9px;border-radius:5px;white-space:nowrap"></div>

  <div style="position:absolute;left:50%;bottom:0;z-index:7;width:{{ odWidth }};padding:0 22px {{ odPadBottom }};border-radius:16px 16px 0 0;background:rgba(28,15,20,.94);border:1px solid rgba(255,255,255,.15);border-bottom:none;backdrop-filter:blur(18px);box-shadow:{{ odShadow }};display:flex;flex-direction:column;transform:translate(-50%,0);transition:width .52s cubic-bezier(.22,.9,.24,1), padding-bottom .52s cubic-bezier(.22,.9,.24,1), box-shadow .3s ease">
    <div onClick="{{ odToggle }}" style="display:flex;flex-direction:column;align-items:stretch;gap:12px;width:100%;padding:14px 4px 4px;cursor:pointer">
      <div style="align-self:center;width:52px;height:4px;flex:none;border-radius:2px;background:rgba(220,170,140,.35)"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 12px {{ odRowPadBottom }};overflow:hidden;max-height:{{ odRowMax }};opacity:{{ odTxOp }};transition:max-height .52s cubic-bezier(.22,.9,.24,1), opacity .22s ease, padding .52s cubic-bezier(.22,.9,.24,1)">
        <div style="font:400 16.5px/1.25 Spectral,Georgia,serif;letter-spacing:.004em;color:rgba(249,236,231,.92)">Voir les organites {{ odScope }}</div>
        <div style="font:500 14px/1 'IBM Plex Mono',ui-monospace,monospace;color:#f0a273;flex:none">↑</div>
      </div>
    </div>
    <div style="display:grid;grid-template-rows:{{ odRows }};transition:grid-template-rows .52s cubic-bezier(.22,.9,.24,1)">
      <div style="min-height:0;overflow:hidden">
        <div style="display:flex;flex-direction:column;gap:12px;padding-top:2px;opacity:{{ odInnerOp }};transition:opacity .22s ease">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px">
            <div style="font:400 9px/1.3 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:rgba(228,196,178,.6)">Organites {{ odScope }}</div>
            <div style="font:400 9.5px/1.3 'IBM Plex Mono',ui-monospace,monospace;color:rgba(228,196,178,.4)">cliquer = isoler</div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <sc-for list="{{ odFams }}" as="fam" hint-placeholder-count="3">
              <div onClick="{{ fam.pick }}" style="padding:6px 11px;border-radius:12px;cursor:pointer;background:{{ fam.bg }};border:1px solid {{ fam.br }};font:500 11px/1.2 'IBM Plex Sans',system-ui,sans-serif;color:{{ fam.fg }};display:flex;align-items:center;gap:7px;white-space:nowrap;animation:odRise .46s cubic-bezier(.22,.9,.24,1) both;animation-delay:{{ fam.delay }};transition:background .18s,border-color .18s,color .16s">
                <div style="width:7px;height:7px;border-radius:50%;flex:none;background:{{ fam.dot }}"></div>
                <div>{{ fam.name }}</div>
              </div>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:8px">
            <sc-for list="{{ odItems }}" as="org" hint-placeholder-count="3">
              <div onClick="{{ org.pick }}" style="padding:10px 11px;border-radius:9px;cursor:pointer;background:{{ org.bg }};border:1px solid rgba(220,170,140,.16);display:flex;flex-direction:column;gap:4px;animation:odRise .46s cubic-bezier(.22,.9,.24,1) both;animation-delay:{{ org.delay }};transition:background .18s,border-color .18s">
                <div style="display:flex;align-items:center;gap:6px">
                  <div style="width:7px;height:7px;border-radius:50%;flex:none;background:{{ org.dot }}"></div>
                  <div style="font:500 11.5px/1.2 'IBM Plex Sans',system-ui,sans-serif;color:#f9ece7">{{ org.name }}</div>
                </div>
                <div style="font:400 10.5px/1.35 'IBM Plex Mono',ui-monospace,monospace;color:rgba(244,231,227,.7)">{{ org.sub }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:absolute;right:22px;bottom:56px;z-index:4;width:236px;padding:11px 13px;border-radius:8px;border:1px solid rgba(220,170,140,.16);background:rgba(34,18,24,.5);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px">
    <div style="flex:1">
      <div style="font-size:12.5px;font-weight:600;color:#f8ece7">Atlas de la contraction</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:rgba(244,231,227,.4);line-height:1.5;margin-top:3px">du potentiel d'action au glissement</div>
    </div>
    <div style="color:#f2b389;font-size:12px">→</div>
  </div>

  <div style="position:absolute;right:22px;bottom:24px;z-index:4;display:flex;align-items:baseline;gap:8px">
    <div data-field="1" style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:rgba(244,231,227,.62);letter-spacing:.06em">90 µm</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.2em;color:rgba(244,231,227,.3)">CHAMP</div>
  </div>
  <div style="position:absolute;right:22px;bottom:12px;z-index:4;width:300px;height:2px;background:rgba(255,255,255,.06);border-radius:1px">
    <div data-zoombar="1" style="height:100%;width:60%;background:linear-gradient(90deg,rgba(240,162,115,.3),#f0a273);border-radius:1px"></div>
  </div>
</div>
</template>

<script src="./vendor/dc-runtime.js"></script>
<script type="module">
  // Le composant lit window.THREE et patiente via waitLib() tant qu'il est absent :
  // ce module s'execute apres le script classique ci-dessous, et c'est sans consequence.
  import * as THREE from 'three';
  window.THREE = THREE;
</script>
<script>
class CelluleMusculaire extends DC.Logic {
  constructor(p) {
    super(p);
    this.hostRef = DC.ref();
    this.rootRef = DC.ref();
    this.tipRef = DC.ref();
    this.fadeRef = DC.ref();
    const S = window.__musStage || (window.__musStage = {
      level: 0, cards: [], row: null, odClosed: true, odFam: 0,   // aucun reglage deplie au demarrage
      rotOn: !!p.autoRotate, rotSpeed: 0.3,
      cut: typeof p.cut === 'number' ? p.cut : 0.55,
      spread: p.spread === 'éclaté' ? 1 : 0, resetView: 0
    });
    this.S = S;
    this.state = { tick: 0 };
    this.LEV = [
      { name: 'Fibre musculaire', size: '≈ 50 µm', tag: 'fibre', field: 90, unit: 'µm', rad: 9.4, phi: 1.12, theta: -0.55, rz: 1.06, clip: true },
      { name: 'Sarcomère', size: '≈ 2 µm', tag: 'sarcomère', field: 4, unit: 'µm', rad: 8.7, phi: 1.08, theta: -0.6, rz: 1.05, clip: true },
      { name: "Ponts d'union", size: '≈ 10 nm', tag: 'pont', field: 45, unit: 'nm', rad: 8.9, phi: 1.2, theta: -0.45, rz: 1.3, clip: false }
    ];
    this.INFO = {
      endomysium: { name: 'Endomysium', sub: 'gaine de tissu conjonctif', dot: '#c8a179', rows: [{ k: 'Rôle', v: 'entoure chaque fibre' }, { k: 'Contient', v: 'capillaires et nerfs' }, { k: 'Au-dessus', v: 'périmysium, épimysium' }] },
      sarcolemme: { name: 'Sarcolemme', sub: 'membrane plasmique', dot: '#d4707c', rows: [{ k: 'Autre nom', v: 'membrane plasmique' }, { k: 'Rôle', v: "propage le potentiel d'action" }, { k: 'Récepteurs', v: "à l'acétylcholine" }] },
      jonction: { name: 'Plaque motrice', sub: 'jonction neuromusculaire', dot: '#e8c46a', rows: [{ k: 'Structure', v: 'ensemble de télodendrons' }, { k: 'Position', v: '1 par fibre, en son milieu' }, { k: 'Libère', v: 'acétylcholine par exocytose' }, { k: 'Effet', v: 'canaux Na⁺/K⁺ → PA' }] },
      tubuleT: { name: 'Tubule transverse', sub: 'invagination du sarcolemme', dot: '#5a9ed6', rows: [{ k: 'Rôle', v: "conduit le PA à l'intérieur" }, { k: 'Trajet', v: 'ceinture les myofibrilles' }, { k: 'Triade', v: '1 tubule T + 2 citernes' }] },
      rs: { name: 'Réticulum sarcoplasmique', sub: 'réservoir de calcium', dot: '#5fb0d0', rows: [{ k: 'Équivalent', v: 'réticulum endoplasmique' }, { k: 'Rôle', v: 'stocke et libère le Ca²⁺' }, { k: 'Retour', v: 'par transport actif' }] },
      myofibrille: { name: 'Myofibrille', sub: 'élément contractile', dot: '#c9505a', rows: [{ k: 'Nombre', v: '100 à 1000 par fibre' }, { k: 'Structure', v: 'chaîne de sarcomères' }, { k: 'Aspect', v: 'bandes A sombres, I claires' }] },
      noyau: { name: 'Noyaux', sub: 'périphériques', dot: '#8f7ce0', rows: [{ k: 'Position', v: 'plaqués sous le sarcolemme' }, { k: 'Nombre', v: 'plusieurs par fibre' }, { k: 'Origine', v: 'fusion de myoblastes' }] },
      mitochondrie: { name: 'Mitochondries', sub: "production d'ATP", dot: '#e8a05e', rows: [{ k: 'Rôle', v: 'respiration cellulaire' }, { k: 'Position', v: 'entre les myofibrilles' }, { k: 'Carburant', v: 'glucose, acides gras' }] },
      glycogene: { name: 'Glycogène', sub: 'réserve de glucides', dot: '#f2e2c4', rows: [{ k: 'Rôle', v: 'source rapide de glucose' }, { k: 'Voie', v: 'glycolyse anaérobie' }, { k: 'Voisins', v: 'gouttelettes lipidiques' }] },
      sarcoplasme: { name: 'Sarcoplasme', sub: 'cytoplasme de la fibre', dot: '#a8555f', rows: [{ k: 'Autre nom', v: 'cytoplasme' }, { k: 'Contient', v: 'myoglobine' }, { k: 'Rôle', v: "réserve d'oxygène" }] },
      strieZ: { name: 'Strie Z', sub: 'limite du sarcomère', dot: '#f0d3c0', rows: [{ k: 'Rôle', v: 'ancre les filaments fins' }, { k: 'Structure', v: 'disque protéique' }, { k: 'Écart', v: '≈ 2 µm au repos' }] },
      actine: { name: "Filament fin d'actine", sub: 'bande I', dot: '#e9b48f', rows: [{ k: 'Bande', v: 'I — claire' }, { k: 'Partenaires', v: 'tropomyosine, troponine' }, { k: 'Ancrage', v: 'strie Z' }] },
      myosine: { name: 'Filament épais de myosine', sub: 'bande A', dot: '#c0454f', rows: [{ k: 'Bande', v: 'A — sombre' }, { k: 'Têtes', v: "ponts d'union" }, { k: 'Zone nue', v: 'au centre (zone H)' }] },
      ligneM: { name: 'Ligne M', sub: 'centre du sarcomère', dot: '#d9d16a', rows: [{ k: 'Rôle', v: 'aligne les filaments épais' }, { k: 'Position', v: 'milieu de la zone H' }] },
      titine: { name: 'Titine', sub: 'ressort moléculaire', dot: '#8fd0b0', rows: [{ k: 'Rôle', v: 'élasticité passive' }, { k: 'Trajet', v: 'strie Z → ligne M' }, { k: 'Effet', v: 'recentre les filaments' }] },
      citerne: { name: 'Citerne terminale', sub: 'réticulum sarcoplasmique', dot: '#7fd0e8', rows: [{ k: 'Contenu', v: 'Ca²⁺ concentré' }, { k: 'Triade', v: '2 citernes + 1 tubule T' }, { k: 'Libération', v: 'canaux voltage-dépendants' }] },
      tubuleT2: { name: 'Tubule transverse', sub: 'jonction des bandes A et I', dot: '#5a9ed6', rows: [{ k: 'Rôle', v: 'amène la dépolarisation' }, { k: 'Position', v: '2 par sarcomère' }, { k: 'Suite', v: 'Ca²⁺ dans le sarcoplasme' }] },
      rsSleeve: { name: 'Réticulum sarcoplasmique', sub: 'manchon longitudinal', dot: '#5ab6d6', rows: [{ k: 'Forme', v: 'enveloppe la myofibrille' }, { k: 'Rôle', v: 'pompe le Ca²⁺ au repos' }, { k: 'Muscle lisse', v: 'moins développé' }] },
      mito2: { name: 'Mitochondrie', sub: 'entre les myofibrilles', dot: '#e8a05e', rows: [{ k: 'Rôle', v: "fournit l'ATP du cycle" }, { k: 'Cardiaque', v: 'beaucoup plus nombreuses' }, { k: 'Effet', v: 'résistance à la fatigue' }] },
      actineG: { name: 'Actine G', sub: 'monomère globulaire', dot: '#e8b48c', rows: [{ k: 'Assemblage', v: 'double hélice' }, { k: 'Site', v: 'fixation de la myosine' }, { k: 'Diamètre', v: '≈ 7 nm' }] },
      tropomyosine: { name: 'Tropomyosine', sub: 'masque les sites', dot: '#6fbf9a', rows: [{ k: 'Au repos', v: 'bloque les sites' }, { k: 'Contraction', v: 'se déplace de côté' }, { k: 'Muscle lisse', v: 'stabilise les filaments' }] },
      troponine: { name: 'Complexe de troponine', sub: 'capteur de calcium', dot: '#d8b04a', rows: [{ k: 'Fixe', v: 'le Ca²⁺' }, { k: 'Effet', v: 'déplace la tropomyosine' }, { k: 'Muscle lisse', v: 'remplacée par la calmoduline' }] },
      teteMyosine: { name: 'Tête de myosine', sub: "pont d'union", dot: '#e2606c', rows: [{ k: 'Cycle', v: 'fixation, pivot, détachement' }, { k: 'Énergie', v: "hydrolyse de l'ATP" }, { k: 'Résultat', v: 'glissement des filaments' }] },
      filamentEpais: { name: 'Filament épais', sub: 'faisceau de myosines', dot: '#8f2f3a', rows: [{ k: 'Structure', v: 'queues enroulées' }, { k: 'Têtes', v: 'en hélice autour' }, { k: 'Nombre', v: '≈ 300 molécules' }] },
      calcium: { name: 'Ion Ca²⁺', sub: 'signal de contraction', dot: '#9fe0ff', rows: [{ k: 'Origine', v: 'réticulum sarcoplasmique' }, { k: 'Cible', v: 'la troponine' }, { k: 'Retour', v: 'pompe active' }] },
      atp: { name: 'ATP', sub: 'carburant du cycle', dot: '#f0c14a', rows: [{ k: 'Rôle', v: 'arme la tête de myosine' }, { k: 'Produit', v: 'ADP + Pi' }, { k: 'Source', v: 'mitochondries, glycolyse' }] }
    };
    /* --- Plongee « powers of ten » -------------------------------------------
       Portee de assets/engine.js (la cellule animale) : au lieu de basculer d'une
       strate a l'autre par un fondu, on tient une profondeur CONTINUE en log10 et on
       met les strates a l'echelle en fonction d'elle. V = la taille de champ de chaque
       strate, ramenee a une unite commune (le micrometre).                          */
    this.V = this.LEV.map(L => (L.unit === 'nm' ? L.field / 1000 : L.field));   // [90, 4, 0.045] µm
    this.fieldTop = this.V[0];
    this.Pmax = Math.log10(this.V[0] / this.V[this.V.length - 1]);
    this.depth = 0;
    this.depthTarget = 0;
    this.curField = this.V[0];

    /* Panneau des organites : une famille a la fois, comme la cellule animale et la
       vegetale. Les identifiants sont ceux de INFO, regroupes par fonction.       */
    this.FAMS = [
      [
        { name: 'Enveloppes', ids: ['endomysium', 'sarcolemme'] },
        { name: 'Commande nerveuse', ids: ['jonction', 'tubuleT', 'rs'] },
        { name: 'Appareil contractile', ids: ['myofibrille'] },
        { name: 'Métabolisme', ids: ['mitochondrie', 'glycogene', 'sarcoplasme'] },
        { name: 'Noyaux', ids: ['noyau'] }
      ],
      [
        { name: 'Limites du sarcomère', ids: ['strieZ', 'ligneM'] },
        { name: 'Filaments', ids: ['actine', 'myosine', 'titine'] },
        { name: 'Couplage excitation-contraction', ids: ['citerne', 'tubuleT2', 'rsSleeve'] },
        { name: 'Énergie', ids: ['mito2'] }
      ],
      [
        { name: 'Filament fin', ids: ['actineG', 'tropomyosine', 'troponine'] },
        { name: 'Filament épais', ids: ['filamentEpais', 'teteMyosine'] },
        { name: 'Signaux', ids: ['calcium', 'atp'] }
      ]
    ];
    this.SCOPE = ['de la fibre observée', 'du sarcomère', "des ponts d'union"];

    this.parts = {};
    this.pick = [[], [], []];
    this.groups = [];
    this.capRec = {};
    this.shellDefs = {};
    this.hover = null;
    this.seed = 20260820;
  }

  /* --- primitives reprises telles quelles de engine.js, pour que la plongee se
         comporte exactement comme celle de la cellule animale ------------------- */
  // Clamp doux : l'echelle sature vers `m` au lieu d'exploser quand une strate
  // sort du champ. C'est le `ke` de engine.js.
  soft(x, m = 6, n = 6) { return x / Math.pow(1 + Math.pow(x / m, n), 1 / n); }
  smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  // L'opacite d'origine de chaque materiau est memorisee au premier passage : sans ca
  // un fondu ecraserait definitivement les transparences voulues par le modele.
  setGroupAlpha(g, a) {
    const plein = a >= 0.999;
    g.traverse(o => {
      if (!(o.isMesh || o.isPoints || o.isLine || o.isSprite)) return;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) {
        if (!m) continue;
        if (m.userData.baseOpacity == null) {
          m.userData.baseOpacity = (m.opacity == null ? 1 : m.opacity);
          m.userData.baseTransparent = !!m.transparent;
          m.userData.baseDepthWrite = ('depthWrite' in m) ? m.depthWrite : true;
        }
        // Hors fondu on REND au materiau son etat d'origine. Forcer `transparent` en
        // permanence faisait passer toute la scene dans la passe transparente, triee par
        // distance : des organites disparaissaient puis revenaient selon l'angle de vue.
        if (plein) {
          m.opacity = m.userData.baseOpacity;
          m.transparent = m.userData.baseTransparent;
          if ('depthWrite' in m) m.depthWrite = m.userData.baseDepthWrite;
        } else {
          m.opacity = a * m.userData.baseOpacity;
          m.transparent = true;
          if ('depthWrite' in m && !o.isPoints && !o.isLine && !o.isSprite) m.depthWrite = a > 0.85;
        }
      }
    });
  }
  measureMaxDim(g) {
    const T = this.T;
    g.updateMatrixWorld(true);
    const box = new T.Box3(); let found = false;
    g.traverse(o => { if ((o.isMesh || o.isInstancedMesh) && o.geometry) { box.expandByObject(o); found = true; } });
    if (!found || box.isEmpty()) box.setFromObject(g);
    const v = new T.Vector3(); box.getSize(v);
    return Math.max(v.x, v.y, v.z) || 1;
  }

  rnd() { this.seed = (this.seed * 1103515245 + 12345) & 0x7fffffff; return this.seed / 0x7fffffff; }
  rr(a, b) { return a + (b - a) * this.rnd(); }

  sync() {
    const o = this.S.owner;
    if (o && o.applyStage) o.applyStage(false);
    window.dispatchEvent(new Event('mus:state'));
  }
  componentDidMount() {
    this.mounted = true;
    this._onS = () => { if (this.mounted) this.forceUpdate(); };
    window.addEventListener('mus:state', this._onS);
    this.waitLib();
  }
  componentWillUnmount() {
    this.mounted = false;
    window.removeEventListener('mus:state', this._onS);
    if (this._t) clearTimeout(this._t);
    if (window.__musStage.owner === this) {
      setTimeout(() => {
        if (document.querySelector('[data-mus-host]')) return;
        if (this._raf) cancelAnimationFrame(this._raf);
        if (this.renderer) {
          this.renderer.dispose();
          const el = this.renderer.domElement;
          if (el.parentNode) el.parentNode.removeChild(el);
        }
        if (window.__musStage.owner === this) window.__musStage.owner = null;
      }, 1600);
    }
  }
  waitLib() {
    if (!this.mounted) return;
    if (window.THREE && this.hostRef.current) this.init();
    else this._t = setTimeout(() => this.waitLib(), 70);
  }

  /* ---------- geometry helpers ---------- */
  sq(rx, ry, rz, n, seg) {
    const T = this.T, g = new T.SphereGeometry(1, seg, Math.max(10, Math.round(seg / 2)));
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const l = Math.hypot(x, y, z) || 1; x /= l; y /= l; z /= l;
      const d = Math.pow(Math.pow(Math.abs(x), n) + Math.pow(Math.abs(y), n) + Math.pow(Math.abs(z), n), -1 / n);
      p.setXYZ(i, x * d * rx, y * d * ry, z * d * rz);
    }
    g.computeVertexNormals();
    return g;
  }
  squirclePt(t, rx, ry, n) {
    const c = Math.cos(t), s = Math.sin(t);
    const r = Math.pow(Math.pow(Math.abs(c), n) + Math.pow(Math.abs(s), n), -1 / n);
    return [rx * r * c, ry * r * s];
  }
  capGeom(O, I, zc, seg) {
    const T = this.T; seg = seg || 190;
    const k1 = 1 - Math.pow(Math.min(1, Math.abs(zc) / O.rz), O.n);
    if (k1 <= 0.0008) return new T.BufferGeometry();
    const k2 = 1 - Math.pow(Math.min(1, Math.abs(zc) / I.rz), I.n);
    const s1 = Math.pow(k1, 1 / O.n), s2 = k2 > 0 ? Math.pow(k2, 1 / I.n) : 0;
    const pos = [], idx = [];
    for (let a = 0; a <= seg; a++) {
      const t = a / seg * Math.PI * 2;
      const o = this.squirclePt(t, O.rx * s1, O.ry * s1, O.n);
      const i2 = k2 > 0 ? this.squirclePt(t, I.rx * s2, I.ry * s2, I.n) : [0, 0];
      pos.push(o[0], o[1], zc, i2[0], i2[1], zc);
    }
    for (let a = 0; a < seg; a++) { const b = a * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    g.setIndex(idx); g.computeVertexNormals();
    return g;
  }
  mat(c, o) { return new this.T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.55, metalness: 0 }, o || {})); }
  clipMat(c, o) { return this.mat(c, Object.assign({ clippingPlanes: [this.plane] }, o || {})); }

  reg(level, id, obj, opts) {
    opts = opts || {};
    const mats = [];
    obj.traverse(o => {
      if (o.isMesh) {
        o.userData.oid = id;
        this.pick[level].push(o);
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(m => { if (m && mats.indexOf(m) < 0) { m.userData.e0 = m.emissive ? m.emissive.getHex() : 0; mats.push(m); } });
      }
    });
    const base = obj.position.clone();
    let kids = null;
    if (opts.kids) {
      kids = obj.children.map(c => ({
        o: c, b: c.position.clone(),
        d: c.position.length() > 0.01 ? c.position.clone().normalize() : new this.T.Vector3(0, 1, 0)
      }));
    }
    this.parts[id] = {
      obj, base, mats, level, kids,
      dir: opts.fixed ? new this.T.Vector3() : base.clone().normalize().multiplyScalar(base.length() > 0.01 ? 1 : 0),
      anchor: opts.anchor || null
    };
    return obj;
  }

  /* ---------- organic helpers ---------- */
  nz(x, y, z) {
    return Math.sin(x * 1.7 + 0.9) * Math.sin(y * 2.1 + 2.3) * Math.sin(z * 1.9 + 4.1)
      + 0.55 * Math.sin(x * 3.7 + 1.7) * Math.sin(y * 4.3 + 0.4) * Math.sin(z * 3.1 + 2.9);
  }
  warp(g, amp, freq) {
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const k = 1 + amp * this.nz(x * freq, y * freq, z * freq);
      p.setXYZ(i, x * k, y * k, z * k);
    }
    p.needsUpdate = true; g.computeVertexNormals();
    return g;
  }
  blob(r, seg, amp, sy) {
    const g = this.warp(new this.T.SphereGeometry(r, seg, Math.max(8, Math.round(seg * 0.62))), amp === undefined ? 0.09 : amp, 3.2 / r);
    if (sy) g.scale(1, sy, 1);
    return g;
  }
  tubeG(pts, rad, tSeg, rSeg, closed) {
    const T = this.T;
    const c = new T.CatmullRomCurve3(pts.map(p => new T.Vector3(p[0], p[1], p[2])), !!closed, 'catmullrom', 0.5);
    return new T.TubeGeometry(c, tSeg || 44, rad, rSeg || 6, !!closed);
  }
  wiggle(from, to, n, amp) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push([
        from[0] + (to[0] - from[0]) * t + Math.sin(t * 6.1 + from[0] * 3) * amp * Math.sin(t * Math.PI),
        from[1] + (to[1] - from[1]) * t + Math.sin(t * 4.7 + from[1] * 4) * amp * Math.sin(t * Math.PI),
        from[2] + (to[2] - from[2]) * t + Math.sin(t * 5.3 + from[2] * 5) * amp * Math.sin(t * Math.PI)
      ]);
    }
    return pts;
  }
  /* point on an x-elongated superellipsoid: u = axial fraction, ang = angle in the y/z plane */
  axialPt(S, u, ang, f) {
    f = f === undefined ? 1 : f;
    const s = Math.pow(Math.max(0, 1 - Math.pow(Math.abs(u), S.n)), 1 / S.n);
    const c = Math.cos(ang), si = Math.sin(ang);
    const k = Math.pow(Math.pow(Math.abs(c), S.n) + Math.pow(Math.abs(si), S.n), -1 / S.n);
    return [u * S.rx * f, s * S.ry * k * c * f, s * S.rz * k * si * f];
  }
  xCyl(r1, r2, len, seg) {
    const g = new this.T.CylinderGeometry(r1, r2, len, seg || 14);
    g.rotateZ(Math.PI / 2);
    return g;
  }
  inst(geo, material, list) {
    const T = this.T;
    const im = new T.InstancedMesh(geo, material, list.length);
    const m4 = new T.Matrix4(), q = new T.Quaternion(), sc = new T.Vector3(1, 1, 1), v = new T.Vector3();
    list.forEach((p, i) => {
      v.set(p[0], p[1], p[2]);
      if (p.length > 3) q.setFromAxisAngle(new T.Vector3(1, 0, 0), p[3]); else q.identity();
      m4.compose(v, q, sc);
      im.setMatrixAt(i, m4);
    });
    im.instanceMatrix.needsUpdate = true;
    return im;
  }

  /* ---------- level 1 : skeletal muscle fibre ---------- */
  buildLevel1() {
    const T = this.T, g = new T.Group();
    const O = { rx: 2.92, ry: 1.06, rz: 1.06, n: 4.2 }, I = { rx: 2.86, ry: 0.99, rz: 0.99, n: 4.2 };
    this.shellDefs[0] = { O, I };

    /* endomysium : gaine + fibres de collagène */
    const endo = new T.Group();
    endo.add(new T.Mesh(this.warp(this.sq(O.rx, O.ry, O.rz, O.n, 116), 0.006, 2.2), this.clipMat(0xc8a179, { side: T.DoubleSide, roughness: 0.93, transparent: true, opacity: 0.4 })));
    const colM = this.clipMat(0xa8845c, { roughness: 0.9 });
    for (let k = 0; k < 24; k++) {
      const ph0 = this.rr(0, 6.28), pitch = this.rr(0.9, 2.2) * (this.rnd() > 0.5 ? 1 : -1), pts = [];
      for (let i = 0; i <= 56; i++) {
        const t = i / 56;
        pts.push(this.axialPt(O, -0.985 + 1.97 * t, ph0 + t * pitch * Math.PI * 2, 1.01));
      }
      endo.add(new T.Mesh(this.tubeG(pts, this.rr(0.008, 0.015), 92, 5), colM));
    }
    g.add(this.reg(0, 'endomysium', endo, { fixed: true, anchor: new T.Vector3(-1.9, 1.15, 0.4) }));

    /* sarcolemme + protéines transmembranaires */
    const memb = new T.Group();
    memb.add(new T.Mesh(this.warp(this.sq(I.rx, I.ry, I.rz, I.n, 116), 0.005, 2.6), this.clipMat(0xd4707c, { side: T.DoubleSide, roughness: 0.62, transparent: true, opacity: 0.9 })));
    const prM = this.clipMat(0xf0a08c, { roughness: 0.4 }), pmM = this.clipMat(0xf0d078, { roughness: 0.32 });
    for (let i = 0; i < 66; i++) {
      const u = this.rr(-0.96, 0.96), ang = this.rr(0, 6.28);
      const p = this.axialPt(I, u, ang, 1.002);
      const big = i % 7 === 0;
      const m = new T.Mesh(big ? new T.CylinderGeometry(0.042, 0.055, 0.1, 10) : new T.CylinderGeometry(0.022, 0.03, 0.07, 8), big ? pmM : prM);
      m.position.set(p[0], p[1], p[2]);
      m.lookAt(u * I.rx, 0, 0); m.rotateX(Math.PI / 2);
      memb.add(m);
    }
    g.add(this.reg(0, 'sarcolemme', memb, { fixed: true, anchor: new T.Vector3(1.7, 1.05, 0.35) }));

    const sarc = new T.Mesh(this.sq(I.rx * 0.992, I.ry * 0.985, I.rz * 0.985, I.n, 76), this.clipMat(0x40151d, { side: T.BackSide, roughness: 1, transparent: true, opacity: 0.9 }));
    sarc.renderOrder = -10;
    g.add(this.reg(0, 'sarcoplasme', sarc, { fixed: true, anchor: new T.Vector3(2.35, 0.9, 0.3) }));

    const Oc = { rx: O.rx * 1.002, ry: O.ry * 1.012, rz: O.rz, n: O.n }, Ic = { rx: I.rx * 0.996, ry: I.ry * 0.99, rz: I.rz, n: I.n };
    const cap = new T.Mesh(this.capGeom(Oc, Ic, this.cutZ(0)), this.mat(0xdcae86, { side: T.DoubleSide, roughness: 0.8 }));
    this.capRec[0] = { mesh: cap, O: Oc, I: Ic };
    g.add(cap);

    /* myofibrilles : réseau de rondins striés (bandes A / I / stries Z) */
    const sp = 0.375, mf = [];
    for (let iz = -3; iz <= 3; iz++) {
      for (let iy = -3; iy <= 3; iy++) {
        const y = iy * sp + (Math.abs(iz % 2) ? sp / 2 : 0), z = iz * sp * 0.87;
        if (Math.hypot(y, z) > 0.74) continue;
        mf.push([y, z]);
      }
    }
    const nUnit = 14, per = 0.36, x0 = -2.5;
    const listA = [], listI = [], listZ = [];
    mf.forEach(p => {
      for (let j = 0; j < nUnit; j++) {
        const xc = x0 + j * per;
        listA.push([xc, p[0], p[1]]);
        listI.push([xc - 0.135, p[0], p[1]]);
        listI.push([xc + 0.135, p[0], p[1]]);
        listZ.push([xc + 0.18, p[0], p[1]]);
      }
      listZ.push([x0 - 0.18, p[0], p[1]]);
    });
    const myo = new T.Group();
    myo.add(this.inst(this.xCyl(0.112, 0.112, 0.2, 14), this.clipMat(0x9c3540, { roughness: 0.6 }), listA));
    myo.add(this.inst(this.xCyl(0.088, 0.088, 0.09, 12), this.clipMat(0xdb8f88, { roughness: 0.55 }), listI));
    myo.add(this.inst(this.xCyl(0.126, 0.126, 0.024, 14), this.clipMat(0xf0d3c0, { roughness: 0.5 }), listZ));
    g.add(this.reg(0, 'myofibrille', myo, { fixed: true, anchor: new T.Vector3(-0.5, 0.85, 0.5) }));

    /* réticulum sarcoplasmique : manchons longitudinaux + citernes */
    const rs = new T.Group();
    const rsM = this.clipMat(0x5fb0d0, { roughness: 0.45, transparent: true, opacity: 0.5 });
    for (let k = 0; k < 16; k++) {
      const ang = k / 16 * Math.PI * 2 + 0.2, rad = k % 2 ? 0.62 : 0.86, pts = [];
      for (let i = 0; i <= 26; i++) {
        const t = i / 26, x = -2.62 + 5.24 * t;
        const w = 1 + 0.09 * Math.sin(t * 22 + k);
        pts.push([x, Math.cos(ang) * rad * w, Math.sin(ang) * rad * w]);
      }
      rs.add(new T.Mesh(this.tubeG(pts, 0.021, 54, 5), rsM));
    }
    const stations = [-0.68, -0.23, 0.23, 0.68];
    const cisM = this.clipMat(0x7fd0e8, { roughness: 0.4, transparent: true, opacity: 0.62 });
    stations.forEach(u => {
      const x = u * I.rx;
      [-0.09, 0.09].forEach(dx => {
        const t2 = new T.Mesh(new T.TorusGeometry(0.9, 0.055, 8, 42), cisM);
        t2.rotation.y = Math.PI / 2; t2.position.x = x + dx; rs.add(t2);
      });
    });
    g.add(this.reg(0, 'rs', rs, { fixed: true, anchor: new T.Vector3(0.3, 1.0, 0.5) }));

    /* tubules transverses : anneaux + ramifications radiales */
    const tt = new T.Group();
    const ttM = this.clipMat(0x5a9ed6, { roughness: 0.42, transparent: true, opacity: 0.85 });
    stations.forEach(u => {
      const x = u * I.rx;
      const ring = new T.Mesh(new T.TorusGeometry(0.94, 0.042, 8, 46), ttM);
      ring.rotation.y = Math.PI / 2; ring.position.x = x; tt.add(ring);
      const inner = new T.Mesh(new T.TorusGeometry(0.34, 0.032, 7, 30), ttM);
      inner.rotation.y = Math.PI / 2; inner.position.x = x; tt.add(inner);
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * Math.PI * 2 + 0.35;
        const sp2 = new T.Mesh(new T.CylinderGeometry(0.032, 0.032, 0.6, 8), ttM);
        sp2.position.set(x, Math.cos(a) * 0.64, Math.sin(a) * 0.64);
        sp2.rotation.x = a; tt.add(sp2);
      }
    });
    g.add(this.reg(0, 'tubuleT', tt, { fixed: true, anchor: new T.Vector3(-2.0, 0.95, 0.3) }));

    /* noyaux périphériques */
    const nuc = new T.Group();
    [[-0.56, 1.35], [0.08, 4.25], [0.68, 0.45], [-0.1, 2.6]].forEach(q => {
      const p = this.axialPt(I, q[0], q[1], 0.8);
      const grp = new T.Group();
      const shell = new T.Mesh(this.blob(0.27, 28, 0.09), this.clipMat(0x7b62d4, { side: T.DoubleSide, transparent: true, opacity: 0.72, roughness: 0.55 }));
      shell.scale.set(1.25, 0.34, 0.62);
      const nlo = new T.Mesh(this.blob(0.08, 16, 0.14), this.clipMat(0xd9a04a, { roughness: 0.55 }));
      nlo.scale.set(1.1, 0.5, 0.9);
      grp.add(shell, nlo);
      const chrM = this.clipMat(0xb6a2f5, { roughness: 0.55 });
      for (let i = 0; i < 4; i++) {
        const a = [this.rr(-0.2, 0.2), this.rr(-0.05, 0.05), this.rr(-0.12, 0.12)];
        const b = [this.rr(-0.2, 0.2), this.rr(-0.05, 0.05), this.rr(-0.12, 0.12)];
        grp.add(new T.Mesh(this.tubeG(this.wiggle(a, b, 7, 0.09), 0.013, 32, 5), chrM));
      }
      grp.position.set(p[0], p[1], p[2]);
      grp.rotation.x = q[1];
      nuc.add(grp);
    });
    g.add(this.reg(0, 'noyau', nuc, { fixed: true, kids: true, anchor: new T.Vector3(-1.6, 1.0, 0.4) }));

    /* mitochondries dans les couloirs inter-myofibrillaires */
    const mito = new T.Group();
    [[-1.9, 0.55, 4.9], [-0.9, 0.6, 1.1], [0.15, 0.58, 3.6], [1.1, 0.6, 0.3], [2.0, 0.55, 2.4], [-1.4, 0.52, 2.2], [0.7, 0.56, 5.6], [1.7, 0.54, 4.3]].forEach(q => {
      const m = new T.Group();
      const L0 = this.rr(0.3, 0.46), R0 = this.rr(0.075, 0.1);
      const outer = new T.Mesh(this.warp(new T.CapsuleGeometry(R0, L0, 8, 20), 0.04, 6.5), this.clipMat(0xe8a05e, { transparent: true, opacity: 0.68, roughness: 0.68, side: T.DoubleSide }));
      outer.rotation.z = Math.PI / 2;
      m.add(outer);
      const cr = this.clipMat(0xffd0a0, { roughness: 0.42 });
      for (let i = 0; i < 6; i++) {
        const t2 = new T.Mesh(new T.TorusGeometry(R0 * 0.7, 0.012, 6, 18), cr);
        t2.rotation.y = Math.PI / 2;
        t2.position.x = -L0 / 2 + (i + 0.5) * (L0 / 6);
        t2.rotation.z = this.rr(-0.4, 0.4);
        m.add(t2);
      }
      m.position.set(q[0], Math.cos(q[2]) * q[1], Math.sin(q[2]) * q[1]);
      m.rotation.x = this.rr(-0.4, 0.4);
      mito.add(m);
    });
    g.add(this.reg(0, 'mitochondrie', mito, { fixed: true, kids: true, anchor: new T.Vector3(0.9, 0.9, 0.45) }));

    /* glycogène + gouttelettes lipidiques */
    const gly = new T.Group();
    const glM = this.clipMat(0xf2e2c4, { roughness: 0.55 }), lpM = this.clipMat(0xf0c878, { roughness: 0.22, metalness: 0.1 });
    const glyList = [];
    for (let i = 0; i < 54; i++) {
      const r = this.rr(0.2, 0.9), a = this.rr(0, 6.28);
      glyList.push([this.rr(-2.5, 2.5), Math.cos(a) * r, Math.sin(a) * r]);
    }
    gly.add(this.inst(new T.SphereGeometry(0.026, 8, 6), glM, glyList));
    for (let i = 0; i < 5; i++) {
      const r = this.rr(0.35, 0.8), a = this.rr(0, 6.28);
      const s = new T.Mesh(this.blob(this.rr(0.07, 0.1), 16, 0.06), lpM);
      s.position.set(this.rr(-2.2, 2.2), Math.cos(a) * r, Math.sin(a) * r);
      gly.add(s);
    }
    g.add(this.reg(0, 'glycogene', gly, { fixed: true, anchor: new T.Vector3(1.4, 0.85, 0.5) }));

    /* plaque motrice : axone, télodendrons et corpuscules nerveux terminaux */
    const nmj = new T.Group();
    const axM = this.clipMat(0xf0d484, { roughness: 0.45 });
    const myeM = this.clipMat(0xf7e6bc, { roughness: 0.6, transparent: true, opacity: 0.85, side: T.DoubleSide });
    const vesM = this.clipMat(0xfff0c0, { roughness: 0.35 });
    const boutM = this.clipMat(0xe8c46a, { roughness: 0.5, transparent: true, opacity: 0.84, side: T.DoubleSide });
    const gutM = this.clipMat(0xf2a898, { roughness: 0.5, side: T.DoubleSide });

    /* axone descendant à la verticale, au-dessus du milieu de la fibre */
    const hub = [0, 1.62, 0.04];
    nmj.add(new T.Mesh(this.tubeG([[-0.85, 3.15, 0.5], [-0.5, 2.6, 0.32], [-0.16, 2.06, 0.14], hub], 0.085, 46, 10), axM));
    for (let i = 0; i < 3; i++) {
      const s = new T.Mesh(new T.CylinderGeometry(0.135, 0.135, 0.34, 14, 1, true), myeM);
      s.position.set(-0.66 + i * 0.24, 2.86 - i * 0.42, 0.42 - i * 0.13);
      s.rotation.z = 0.5; s.rotation.x = -0.2;
      nmj.add(s);
    }

    /* télodendrons : 6 branches vers la surface, réparties de part et d'autre du plan de coupe */
    const tips = [[-0.92, 0.02], [-0.55, -0.22], [-0.18, 0.16], [0.2, -0.14], [0.58, 0.2], [0.95, -0.05]];
    tips.forEach((q, i) => {
      const px2 = q[0], pz = q[1];
      /* hauteur exacte du sarcolemme au-dessus de (x, z) */
      const py = I.ry * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(px2 / I.rx), I.n) - Math.pow(Math.abs(pz / I.rz), I.n)), 1 / I.n);
      /* branche */
      nmj.add(new T.Mesh(this.tubeG([hub, [hub[0] + (px2 - hub[0]) * 0.45, 1.42 - i * 0.02, hub[2] + (pz - hub[2]) * 0.4], [px2 * 0.97, py + 0.42, pz * 0.92], [px2, py + 0.22, pz]], 0.038, 44, 7), axM));
      /* corpuscule nerveux terminal posé sur le sarcolemme */
      const b = new T.Mesh(this.blob(0.19, 22, 0.09), boutM);
      b.scale.set(1.25, 0.62, 0.95);
      b.position.set(px2, py + 0.135, pz);
      nmj.add(b);
      const vl = [];
      for (let k = 0; k < 9; k++) vl.push([px2 + this.rr(-0.14, 0.14), py + this.rr(0.07, 0.2), pz + this.rr(-0.09, 0.09)]);
      nmj.add(this.inst(new T.SphereGeometry(0.028, 8, 6), vesM, vl));
      /* gouttière synaptique : replis du sarcolemme sous le corpuscule */
      for (let k = 0; k < 5; k++) {
        const f = new T.Mesh(new T.BoxGeometry(0.038, 0.08, 0.24), gutM);
        f.position.set(px2 - 0.1 + k * 0.05, py - 0.015, pz);
        nmj.add(f);
      }
    });
    g.add(this.reg(0, 'jonction', nmj, { fixed: true, anchor: new T.Vector3(0, 1.75, 0.3) }));

    g.traverse(o => {
      if (!o.isMesh) return;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        if (m && m.transparent && m.opacity < 0.8) m.depthWrite = false;
      });
    });
    return g;
  }

  /* ---------- level 2 : sarcomere ---------- */
  buildLevel2() {
    const T = this.T, g = new T.Group();
    const d = 0.30, RM = 0.6, RA = 0.66;
    const hex = [], tri = [];
    for (let i = -5; i <= 5; i++) {
      for (let j = -5; j <= 5; j++) {
        const y = i * d + j * d * 0.5, z = j * d * 0.866;
        if (Math.hypot(y, z) <= RM) hex.push([y, z]);
        [[0.5, 0.2887], [1.0, 0.5774]].forEach(c => {
          const ay = y + c[0] * d, az = z + c[1] * d;
          if (Math.hypot(ay, az) <= RA) tri.push([ay, az]);
        });
      }
    }
    const zx = 1.9, aIn = 0.4, mHalf = 1.28;

    /* stries Z */
    const zg = new T.Group();
    const zM = this.clipMat(0xf0d3c0, { roughness: 0.5, side: T.DoubleSide });
    [-zx, zx].forEach(x => {
      const disc = new T.Mesh(this.xCyl(0.78, 0.78, 0.06, 44), zM);
      disc.position.x = x; zg.add(disc);
      for (let k = 0; k < 22; k++) {
        const a = k / 22 * Math.PI * 2, r = 0.4 + (k % 3) * 0.17;
        const b = new T.Mesh(new T.BoxGeometry(0.1, 0.05, 0.05), zM);
        b.position.set(x + (k % 2 ? 0.05 : -0.05), Math.cos(a) * r, Math.sin(a) * r);
        zg.add(b);
      }
    });
    g.add(this.reg(1, 'strieZ', zg, { fixed: true, kids: true, anchor: new T.Vector3(-1.9, 0.95, 0.3) }));

    /* filaments fins d'actine */
    const aLen = zx - aIn - 0.03, aList = [];
    tri.forEach(p => {
      aList.push([-(aIn + aLen / 2), p[0], p[1]]);
      aList.push([aIn + aLen / 2, p[0], p[1]]);
    });
    const act = new T.Group();
    act.add(this.inst(this.xCyl(0.03, 0.03, aLen, 10), this.clipMat(0xe9b48f, { roughness: 0.5 }), aList));
    g.add(this.reg(1, 'actine', act, { fixed: true, anchor: new T.Vector3(-1.1, 0.85, 0.4) }));

    /* filaments épais de myosine + têtes */
    const mg = new T.Group();
    const mM = this.clipMat(0xc0454f, { roughness: 0.5 });
    const gMyo = this.xCyl(0.052, 0.052, mHalf * 2, 16);
    hex.forEach(p => {
      const m = new T.Mesh(gMyo, mM);
      m.position.set(0, p[0], p[1]);
      mg.add(m);
    });
    const heads = [];
    hex.forEach(p => {
      for (let s = 0; s < 12; s++) {
        const x = (s < 6 ? -1 : 1) * (0.3 + (s % 6) * 0.16);
        const a = s * 1.05 + p[0] * 3;
        heads.push([x, p[0] + Math.cos(a) * 0.075, p[1] + Math.sin(a) * 0.075, a]);
      }
    });
    const gh = new T.SphereGeometry(0.036, 8, 6); gh.scale(1.1, 1.9, 1.1);
    mg.add(this.inst(gh, this.clipMat(0xe2606c, { roughness: 0.42 }), heads));
    g.add(this.reg(1, 'myosine', mg, { fixed: true, anchor: new T.Vector3(0.1, 0.85, 0.45) }));

    /* ligne M */
    const ml = new T.Group();
    const mlM = this.clipMat(0xd9d16a, { roughness: 0.45, side: T.DoubleSide });
    const mdisc = new T.Mesh(this.xCyl(0.64, 0.64, 0.035, 40), mlM);
    ml.add(mdisc);
    for (let k = 0; k < 14; k++) {
      const a = k / 14 * Math.PI * 2;
      const b = new T.Mesh(new T.BoxGeometry(0.07, 0.035, 0.035), mlM);
      b.position.set(0, Math.cos(a) * 0.35, Math.sin(a) * 0.35);
      ml.add(b);
    }
    g.add(this.reg(1, 'ligneM', ml, { fixed: true, anchor: new T.Vector3(0.05, 0.7, 0.4) }));

    /* titine */
    const ti = new T.Group();
    const tiM = this.clipMat(0x8fd0b0, { roughness: 0.45 });
    hex.forEach(p => {
      [-1, 1].forEach(s => {
        const pts = [];
        for (let i = 0; i <= 12; i++) {
          const t = i / 12, x = s * (mHalf + t * (zx - mHalf));
          pts.push([x, p[0] + Math.sin(t * 14) * 0.028, p[1] + Math.cos(t * 14) * 0.028]);
        }
        ti.add(new T.Mesh(this.tubeG(pts, 0.011, 30, 4), tiM));
      });
    });
    g.add(this.reg(1, 'titine', ti, { fixed: true, anchor: new T.Vector3(1.55, 0.8, 0.35) }));

    /* manchon de réticulum sarcoplasmique */
    const rs = new T.Group();
    const rsM = this.clipMat(0x5ab6d6, { roughness: 0.45, transparent: true, opacity: 0.42 });
    for (let k = 0; k < 18; k++) {
      const ang = k / 18 * Math.PI * 2, pts = [];
      for (let i = 0; i <= 24; i++) {
        const t = i / 24, x = -2.2 + 4.4 * t, w = 0.9 * (1 + 0.07 * Math.sin(t * 16 + k));
        pts.push([x, Math.cos(ang) * w, Math.sin(ang) * w]);
      }
      rs.add(new T.Mesh(this.tubeG(pts, 0.028, 46, 5), rsM));
    }
    for (let k = 0; k < 10; k++) {
      const a1 = this.rr(0, 6.28), a2 = a1 + this.rr(0.3, 0.9), x = this.rr(-1.9, 1.9);
      rs.add(new T.Mesh(this.tubeG(this.wiggle([x, Math.cos(a1) * 0.9, Math.sin(a1) * 0.9], [x + this.rr(-0.3, 0.3), Math.cos(a2) * 0.9, Math.sin(a2) * 0.9], 6, 0.1), 0.022, 24, 4), rsM));
    }
    g.add(this.reg(1, 'rsSleeve', rs, { fixed: true, anchor: new T.Vector3(-0.6, 1.15, 0.4) }));

    /* triades : citernes terminales + tubule T */
    const cis = new T.Group();
    const cisM = this.clipMat(0x7fd0e8, { roughness: 0.4, transparent: true, opacity: 0.6, side: T.DoubleSide });
    const caM = this.mat(0x9fe0ff, { roughness: 0.25, emissive: 0x1b4a63, clippingPlanes: [this.plane] });
    [-1.32, 1.32].forEach(x => {
      [-0.19, 0.19].forEach(dx => {
        const t2 = new T.Mesh(new T.TorusGeometry(0.96, 0.11, 10, 48), cisM);
        t2.rotation.y = Math.PI / 2; t2.position.x = x + dx; cis.add(t2);
      });
      for (let k = 0; k < 14; k++) {
        const a = k / 14 * Math.PI * 2;
        const s = new T.Mesh(new T.SphereGeometry(0.028, 8, 6), caM);
        s.position.set(x + (k % 2 ? 0.19 : -0.19) + this.rr(-0.05, 0.05), Math.cos(a) * 0.96, Math.sin(a) * 0.96);
        cis.add(s);
      }
    });
    g.add(this.reg(1, 'citerne', cis, { fixed: true, anchor: new T.Vector3(1.32, 1.25, 0.4) }));

    const tt = new T.Group();
    const ttM = this.clipMat(0x5a9ed6, { roughness: 0.42, transparent: true, opacity: 0.85, side: T.DoubleSide });
    [-1.32, 1.32].forEach(x => {
      const r1 = new T.Mesh(new T.TorusGeometry(0.96, 0.062, 9, 48), ttM);
      r1.rotation.y = Math.PI / 2; r1.position.x = x; tt.add(r1);
    });
    g.add(this.reg(1, 'tubuleT2', tt, { fixed: true, anchor: new T.Vector3(-1.32, 1.3, 0.35) }));

    /* mitochondries longeant la myofibrille */
    const mito = new T.Group();
    [[-0.9, 1.3, 1.9], [0.95, 1.3, 4.6]].forEach(q => {
      const m = new T.Group();
      const outer = new T.Mesh(this.warp(new T.CapsuleGeometry(0.19, 0.85, 10, 22), 0.035, 5.5), this.clipMat(0xe8a05e, { transparent: true, opacity: 0.68, roughness: 0.68, side: T.DoubleSide }));
      outer.rotation.z = Math.PI / 2;
      m.add(outer);
      const cr = this.clipMat(0xffd0a0, { roughness: 0.42 });
      for (let i = 0; i < 8; i++) {
        const t2 = new T.Mesh(new T.TorusGeometry(0.13, 0.018, 6, 20), cr);
        t2.rotation.y = Math.PI / 2; t2.position.x = -0.42 + i * 0.12; t2.rotation.z = this.rr(-0.4, 0.4);
        m.add(t2);
      }
      m.position.set(q[0], Math.cos(q[2]) * q[1], Math.sin(q[2]) * q[1]);
      mito.add(m);
    });
    g.add(this.reg(1, 'mito2', mito, { fixed: true, kids: true, anchor: new T.Vector3(-0.9, 1.5, 0.4) }));

    g.traverse(o => {
      if (!o.isMesh) return;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        if (m && m.transparent && m.opacity < 0.8) m.depthWrite = false;
      });
    });
    return g;
  }

  /* ---------- level 3 : cross-bridge cycle ---------- */
  buildLevel3() {
    const T = this.T, g = new T.Group();
    const yA = 0.62, yM = -0.62, nMon = 15, xa = -2.3, span = 4.6, twist = 1.6;

    /* filament fin : double hélice d'actine G */
    const act = new T.Group();
    const aM = this.mat(0xe8b48c, { roughness: 0.45 });
    const gMon = new T.SphereGeometry(0.15, 18, 14);
    const helix = (s, t) => {
      const ang = t * Math.PI * 2 * twist + s * Math.PI;
      return [xa + span * t, yA + Math.cos(ang) * 0.15, Math.sin(ang) * 0.15];
    };
    for (let s = 0; s < 2; s++) {
      for (let i = 0; i < nMon; i++) {
        const p = helix(s, i / (nMon - 1));
        const m = new T.Mesh(gMon, aM);
        m.position.set(p[0], p[1], p[2]);
        act.add(m);
      }
    }
    g.add(this.reg(2, 'actineG', act, { fixed: true, anchor: new T.Vector3(-1.4, 1.15, 0.4) }));

    /* tropomyosine : deux brins dans les sillons */
    const tm = new T.Group();
    const tmM = this.mat(0x6fbf9a, { roughness: 0.42 });
    for (let s = 0; s < 2; s++) {
      const pts = [];
      for (let i = 0; i <= 40; i++) {
        const t = i / 40, ang = t * Math.PI * 2 * twist + s * Math.PI + Math.PI / 2;
        pts.push([xa + span * t, yA + Math.cos(ang) * 0.2, Math.sin(ang) * 0.2]);
      }
      tm.add(new T.Mesh(this.tubeG(pts, 0.045, 90, 8), tmM));
    }
    g.add(this.reg(2, 'tropomyosine', tm, { fixed: true, anchor: new T.Vector3(0.4, 1.2, 0.45) }));

    /* complexes de troponine */
    const tn = new T.Group();
    const tnM = this.mat(0xd8b04a, { roughness: 0.42 });
    [0.16, 0.5, 0.84].forEach(t => {
      const ang = t * Math.PI * 2 * twist + Math.PI / 2;
      const c = new T.Group();
      [[0, 0, 0], [0.14, 0.09, 0.03], [-0.1, 0.11, -0.05]].forEach((o, k) => {
        const s = new T.Mesh(new T.SphereGeometry(k === 0 ? 0.11 : 0.085, 14, 10), tnM);
        s.position.set(o[0], o[1], o[2]);
        c.add(s);
      });
      c.position.set(xa + span * t, yA + Math.cos(ang) * 0.26, Math.sin(ang) * 0.26);
      tn.add(c);
    });
    g.add(this.reg(2, 'troponine', tn, { fixed: true, kids: true, anchor: new T.Vector3(-1.0, 1.3, 0.4) }));

    /* filament épais : queues enroulées */
    const th = new T.Group();
    const thM = this.mat(0x8f2f3a, { roughness: 0.52 });
    th.add(new T.Mesh(this.xCyl(0.2, 0.2, 4.4, 28), thM));
    const twM = this.mat(0xa8404c, { roughness: 0.5 });
    for (let s = 0; s < 3; s++) {
      const pts = [];
      for (let i = 0; i <= 36; i++) {
        const t = i / 36, ang = t * Math.PI * 2 * 2.2 + s * 2.1;
        pts.push([-2.2 + 4.4 * t, Math.cos(ang) * 0.21, Math.sin(ang) * 0.21]);
      }
      const tube = new T.Mesh(this.tubeG(pts, 0.035, 80, 6), twM);
      th.add(tube);
    }
    th.position.y = yM;
    g.add(this.reg(2, 'filamentEpais', th, { fixed: true, anchor: new T.Vector3(1.6, -0.4, 0.4) }));

    /* têtes de myosine : trois étapes du cycle */
    const hd = new T.Group();
    const hM = this.mat(0xe2606c, { roughness: 0.4 }), nM = this.mat(0xc9505a, { roughness: 0.45 });
    const mkHead = (x, lean, reach) => {
      const grp = new T.Group();
      const neck = new T.Mesh(new T.CylinderGeometry(0.05, 0.062, 0.62, 12), nM);
      neck.position.y = 0.31; grp.add(neck);
      const head = new T.Mesh(new T.SphereGeometry(0.15, 20, 14), hM);
      head.scale.set(1.7, 0.85, 0.85);
      head.position.set(0.12, 0.68, 0);
      head.rotation.z = 0.5; grp.add(head);
      grp.position.set(x, yM + 0.16, 0);
      grp.rotation.z = lean;
      grp.scale.setScalar(reach);
      return grp;
    };
    hd.add(mkHead(-1.35, 0.34, 1.0));
    const bound = mkHead(-0.1, -0.2, 1.12);
    hd.add(bound);
    hd.add(mkHead(1.25, 0.62, 0.95));
    g.add(this.reg(2, 'teteMyosine', hd, { fixed: true, kids: true, anchor: new T.Vector3(-0.1, 0.15, 0.45) }));

    /* ions calcium */
    const ca = new T.Group();
    const caM = this.mat(0x9fe0ff, { roughness: 0.2, emissive: 0x2a6f8f });
    [[-1.05, 1.3, 0.5], [-0.2, 1.45, -0.35], [0.85, 1.25, 0.42], [1.75, 1.4, -0.2], [-1.9, 1.2, -0.5]].forEach(p => {
      const s = new T.Mesh(new T.SphereGeometry(0.075, 14, 10), caM);
      s.position.set(p[0], p[1], p[2]); ca.add(s);
    });
    g.add(this.reg(2, 'calcium', ca, { fixed: true, kids: true, anchor: new T.Vector3(-0.2, 1.6, 0.4) }));

    /* ATP / ADP + Pi */
    const atp = new T.Group();
    const atM = this.mat(0xf0c14a, { roughness: 0.35 }), piM = this.mat(0xffe9a8, { roughness: 0.3 });
    const cluster = (x, y, z, n) => {
      const c = new T.Group();
      for (let i = 0; i < n; i++) {
        const s = new T.Mesh(new T.SphereGeometry(0.06, 12, 9), i === n - 1 ? piM : atM);
        s.position.set(i * 0.11, Math.sin(i) * 0.03, Math.cos(i) * 0.03);
        c.add(s);
      }
      c.position.set(x, y, z);
      return c;
    };
    atp.add(cluster(-1.6, -0.18, 0.42, 3));
    atp.add(cluster(1.15, -0.2, -0.4, 2));
    g.add(this.reg(2, 'atp', atp, { fixed: true, kids: true, anchor: new T.Vector3(-1.6, 0.2, 0.45) }));

    return g;
  }

  cutZ(level) {
    const L = this.LEV[level === undefined ? this.curLevel : level];
    if (!L.clip) return 999;
    return L.rz * (1.03 - 1.3 * this.S.cut);
  }

  /* ---------- init ---------- */
  init() {
    const S = this.S;
    const VER = 3;
    if (S.owner && S.owner !== this && S.ver !== VER) {
      const o = S.owner;
      if (o._raf) cancelAnimationFrame(o._raf);
      if (o.renderer) { o.renderer.dispose(); const el = o.renderer.domElement; if (el.parentNode) el.parentNode.removeChild(el); }
      S.owner = null;
    }
    S.ver = VER;
    if (S.owner && S.owner !== this && S.owner.renderer && document.contains(S.owner.renderer.domElement)) { this.deferred = true; return; }
    S.owner = this;
    this.curLevel = S.level;
    this.appliedCut = S.cut;
    const T = window.THREE; this.T = T;
    try { T.ColorManagement.legacyMode = false; } catch (e) { }
    const host = this.hostRef.current;
    this.hostEl = host;
    const w = host.clientWidth || 1440, h = host.clientHeight || 900;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(w, h);
    renderer.localClippingEnabled = true;
    // r152 a remplace outputEncoding/sRGBEncoding par outputColorSpace/SRGBColorSpace.
    // Le composant vient de r149 ; on ecrit la forme moderne, avec repli sur l'ancienne.
    try {
      if ('outputColorSpace' in renderer) renderer.outputColorSpace = T.SRGBColorSpace;
      else renderer.outputEncoding = T.sRGBEncoding;
    } catch (e) { }
    try { renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.03; } catch (e) { }
    renderer.domElement.style.display = 'block';
    host.appendChild(renderer.domElement);
    this.renderer = renderer;

    const scene = new T.Scene(); this.scene = scene;
    const camera = new T.PerspectiveCamera(34, w / h, 0.05, 120); this.camera = camera;
    scene.add(new T.AmbientLight(0xffffff, 0.17));
    scene.add(new T.HemisphereLight(0xffd8c0, 0x3a1a22, 0.44));
    const d1 = new T.DirectionalLight(0xfff0e0, 1.32); d1.position.set(2.6, 3.4, 3.2); scene.add(d1);
    const d2 = new T.DirectionalLight(0x8fc8f5, 0.42); d2.position.set(-3.2, -1.4, 1.6); scene.add(d2);
    const d3 = new T.DirectionalLight(0xff9a86, 0.3); d3.position.set(0.5, -2.4, -3); scene.add(d3);
    const pl = new T.PointLight(0xffc9a0, 0.26, 9, 2); pl.position.set(0, 0.3, 0.8); scene.add(pl);

    this.plane = new T.Plane(new T.Vector3(0, 0, -1), this.cutZ(this.curLevel));

    this.groups = [this.buildLevel1(), this.buildLevel2(), this.buildLevel3()];
    // Chaque strate est ramenee a une taille commune a l'ecran (TARGET), comme dans
    // engine.js : c'est ce qui permet de les enchainer sans saut de taille apparent.
    // La mesure se fait a l'echelle 1, avant que la plongee ne s'en empare.
    // Reference = la strate 1, telle qu'elle etait cadree avant la plongee (son baseScale
    // vaut donc exactement 1). Les deux autres sont ramenees a la meme taille apparente,
    // faute de quoi on verrait un saut de taille en passant de l'une a l'autre.
    const TARGET = this.measureMaxDim(this.groups[0]);
    this.baseScale = this.groups.map(g => TARGET / this.measureMaxDim(g));
    this.groups.forEach(g => { g.visible = false; scene.add(g); });

    if (this.props.particles !== false) {
      const n = 400, pos = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const r = this.rr(3.4, 9.2), th = this.rr(0, Math.PI * 2), ph = Math.acos(this.rr(-1, 1));
        pos[i * 3] = r * Math.sin(ph) * Math.cos(th); pos[i * 3 + 1] = r * Math.cos(ph) * 0.7; pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
      }
      const pg = new T.BufferGeometry(); pg.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
      this.dust = new T.Points(pg, new T.PointsMaterial({ color: 0xf3c8ac, size: 0.034, transparent: true, opacity: 0.38, depthWrite: false }));
      scene.add(this.dust);
    }

    const L = this.LEV[this.curLevel];
    // La camera ne recule plus d'une strate a l'autre : ce sont les modeles qui changent
    // d'echelle sous une camera a distance fixe. C'est tout le principe du powers of ten.
    this.RAD = L.rad;          // distance camera d'origine de la strate 1
    this.cam = { theta: L.theta, phi: L.phi, rad: this.RAD, tRad: this.RAD };
    this.ray = new T.Raycaster();
    this.spreadCur = S.spread;
    this.appliedReset = S.resetView;
    this.bindEvents(host);
    this.applyCut();
    this.resize();
    this.loop(0);
  }

  resize() {
    const host = this.hostEl || this.hostRef.current; if (!host || !this.renderer) return;
    const w = host.clientWidth || 1, h = host.clientHeight || 1;
    this.lastW = w; this.lastH = h;
    this.renderer.setSize(w, h); this.camera.aspect = w / h;
    this.camera.setViewOffset(w, h, -w * 0.05, h * 0.03, w, h);
    this.camera.updateProjectionMatrix();
  }

  bindEvents(host) {
    const el = this.renderer.domElement;
    let dragging = false, lx = 0, ly = 0, moved = 0;
    el.addEventListener('pointerdown', e => {
      dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; el.style.cursor = 'grabbing';
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      const r = el.getBoundingClientRect();
      this.ptr = { x: ((e.clientX - r.left) / r.width) * 2 - 1, y: -((e.clientY - r.top) / r.height) * 2 + 1, cx: e.clientX - r.left, cy: e.clientY - r.top };
      if (dragging) {
        const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
        moved += Math.abs(dx) + Math.abs(dy);
        this.cam.theta -= dx * 0.006;
        this.cam.phi = Math.max(0.3, Math.min(2.75, this.cam.phi - dy * 0.006));
      }
    });
    el.addEventListener('pointerup', e => {
      el.style.cursor = 'grab';
      if (dragging && moved < 6) this.doPick();
      dragging = false;
    });
    el.addEventListener('pointerleave', () => { this.ptr = null; this.setHover(null); });
    // Molette : meme geste que la plongee de la cellule animale. Tant qu'on est dans les
    // bornes d'une strate elle recule/avance la camera ; quand on bute sur une borne, elle
    // enchaine sur la strate suivante au lieu de s'arreter net.
    el.addEventListener('wheel', e => {
      e.preventDefault();
      // Meme geste et meme coefficient que la plongee de la cellule animale.
      this.depthTarget = Math.max(0, Math.min(this.Pmax, this.depthTarget - e.deltaY * 0.0016));
    }, { passive: false });

    // Clavier, comme la plongee : bas = plonger, haut = remonter.
    window.addEventListener('keydown', e => {
      const t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      const step = d => { this.depthTarget = Math.max(0, Math.min(this.Pmax, this.depthTarget + d)); };
      if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); step(0.18); }
      else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); step(-0.18); }
    });
  }

  hitTest() {
    if (!this.ptr) return null;
    this.ray.setFromCamera({ x: this.ptr.x, y: this.ptr.y }, this.camera);
    const hits = this.ray.intersectObjects(this.pick[this.curLevel], true);
    const clip = this.LEV[this.curLevel].clip;
    for (let i = 0; i < hits.length; i++) {
      if (clip && this.plane.distanceToPoint(hits[i].point) < 0) continue;
      return hits[i].object.userData.oid;
    }
    return null;
  }
  setHover(id) {
    if (this.hover === id) return;
    if (this.hover && this.parts[this.hover]) this.parts[this.hover].mats.forEach(m => { if (m.emissive) { m.emissive.setHex(m.userData.e0 || 0); m.emissiveIntensity = 1; } });
    this.hover = id;
    if (id && this.parts[id]) this.parts[id].mats.forEach(m => { if (m.emissive) { m.emissive.setHex(0x6e3524); m.emissiveIntensity = 1; } });
    if (id && this.INFO[id]) document.querySelectorAll('[data-mus-tip]').forEach(t => { t.textContent = this.INFO[id].name; });
    else document.querySelectorAll('[data-mus-tip]').forEach(t => { t.style.transform = 'translate(-9999px,-9999px)'; });
    if (this.renderer) this.renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
  }
  doPick() {
    const id = this.hitTest();
    const S = this.S;
    // Clic dans le vide : on referme les fiches ouvertes, au lieu de les laisser
    // s'empiler jusqu'a trois sans autre issue que leur croix.
    // (le garde `moved < 6` en amont fait qu'une rotation ne passe pas par ici)
    if (!id || !this.INFO[id]) {
      if (!S.cards.length) return;
      S.cards = [];
      this.sync();
      return;
    }
    S.cards = S.cards.filter(c => c !== id).concat([id]).slice(-3);
    this.sync();
  }

  applyCut() {
    const lv = this.curLevel;
    const L = this.LEV[lv];
    const z = this.cutZ(lv);
    if (this.plane) this.plane.constant = z;
    const rec = this.capRec[lv];
    if (rec && L.clip) {
      const g = this.capGeom(rec.O, rec.I, z);
      rec.mesh.geometry.dispose(); rec.mesh.geometry = g;
    }
    [0, 1].forEach(i => { if (this.capRec[i]) this.capRec[i].mesh.visible = i === lv && this.LEV[i].clip; });
  }

  goLevel(n) {
    if (n < 0 || n >= this.V.length) return;
    // On ne bascule plus d'un etat a l'autre : on vise la profondeur de la strate, et la
    // plongee s'y rend en continu en traversant les paliers intermediaires.
    this.depthTarget = Math.log10(this.fieldTop / this.V[n]);
    this.S.cards = [];
    this.sync();
  }

  applySpread() {
    Object.keys(this.parts).forEach(k => {
      const p = this.parts[k];
      if (p.level !== this.curLevel) return;
      if (p.dir.lengthSq() > 0) p.obj.position.copy(p.base).addScaledVector(p.dir, this.spreadCur * 0.3);
      if (p.kids) p.kids.forEach(c => { c.o.position.copy(c.b).addScaledVector(c.d, this.spreadCur * 0.22); });
    });
  }

  /* Coeur de la plongee. Appele a chaque image : on avance la profondeur vers sa cible,
     on cherche la paire de strates qui l'encadre, et on les croise.
     Le croisement n'occupe qu'un quart de l'intervalle (de s=0.34 a s=0.60) : le reste
     du temps une seule strate est a l'ecran, nette. La sortante grossit (x1.55) et
     s'efface tot pour ne pas trainer, enorme et coupee, pendant que la suivante arrive. */
  applyDive() {
    this.depth += (this.depthTarget - this.depth) * 0.1;
    const e = this.fieldTop * Math.pow(10, -this.depth);   // taille de champ courante, en µm
    const t = Math.log10(e);

    let n = 0;
    while (n < this.V.length - 2 && Math.log10(this.V[n + 1]) > t) n++;
    const a = Math.log10(this.V[n]), o = Math.log10(this.V[n + 1]);
    const s = Math.max(0, Math.min(1, (a - t) / (a - o || 1)));
    const c = 0.16;
    const l = s < 0.5 - c ? 0 : s > 0.6 ? 1 : this.smooth((s - (0.5 - c)) / (0.6 - (0.5 - c)));

    const alpha = this.V.map(() => 0), dive = this.V.map(() => 1);
    alpha[n] = 1 - l; alpha[n + 1] = l;
    dive[n] = 1 + l * 0.55; dive[n + 1] = 0.5 + 0.5 * l;

    this.groups.forEach((g, i) => {
      if (alpha[i] <= 0.004) { if (g.visible) g.visible = false; return; }
      g.visible = true;
      g.scale.setScalar(this.soft(this.V[i] / e, 6) * this.baseScale[i] * dive[i]);
      this.setGroupAlpha(g, alpha[i]);
    });

    // Strate dominante : celle dont la taille de champ est la plus proche de la courante.
    // C'est elle qui pilote le HUD, l'echelle affichee, le picking et la coupe.
    let dom = 0, best = 1e9;
    this.V.forEach((v, i) => { const d = Math.abs(Math.log10(v / e)); if (d < best) { best = d; dom = i; } });

    // Le plan de coupe vit en coordonnees monde : sa constante doit suivre l'echelle
    // courante du groupe, sinon la coupe derive pendant tout le zoom.
    if (this.plane) {
      const LD = this.LEV[dom];
      this.plane.constant = LD.clip ? this.cutZ(dom) * this.groups[dom].scale.x : 999;
    }

    this.curField = e;
    if (dom !== this.curLevel) {
      this.curLevel = dom;
      this.S.level = dom;
      this.S.cards = [];        // on change d'echelle : les fiches de l'ancienne n'ont plus de sens
      this.setHover(null);
      this.applyCut();
      this.sync();
    }
  }

  applyStage(fromLoop) {
    const S = this.S;
    if (!this.renderer) return;
    if (S.cut !== this.appliedCut) { this.appliedCut = S.cut; this.applyCut(); }
    if (S.resetView !== this.appliedReset) {
      this.appliedReset = S.resetView;
      const L = this.LEV[this.curLevel];
      this.cam.theta = L.theta; this.cam.phi = L.phi; this.cam.tRad = this.RAD;
    }
    if (!fromLoop && performance.now() - (this.lastTick || 0) > 400) {
      this.spreadCur = S.spread; this.applySpread();
      this.cam.rad = this.cam.tRad;
      this.renderNow();
    }
  }

  renderNow() {
    if (!this.renderer) return;
    const r = this.cam.rad, ph = this.cam.phi, th = this.cam.theta;
    this.camera.position.set(r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph), r * Math.sin(ph) * Math.cos(th));
    this.camera.lookAt(0, 0, 0);
    const w = this.renderer.domElement.clientWidth, h = this.renderer.domElement.clientHeight;
    document.querySelectorAll('[data-card-id]').forEach(el => {
      const p = this.parts[el.getAttribute('data-card-id')];
      if (!p) return;
      const v = (p.anchor ? p.anchor.clone().add(p.obj.position) : p.obj.position.clone());
      p.obj.parent.localToWorld(v);
      v.project(this.camera);
      const x = Math.max(352, Math.min(Math.max(360, w - 332), (v.x * 0.5 + 0.5) * w - 126));
      const y = Math.max(78, Math.min(h - 190, (-v.y * 0.5 + 0.5) * h - 26));
      el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    });
    const L = this.LEV[this.curLevel];
    // L'echelle affichee vient de la profondeur, pas de la distance camera : celle-ci ne
    // bouge plus. curField est en µm, on le reexprime dans l'unite de la strate dominante.
    const val = L.unit === 'nm' ? this.curField * 1000 : this.curField;
    const txt = (val < 20 ? val.toFixed(1) : Math.round(val)) + ' ' + L.unit;
    document.querySelectorAll('[data-field]').forEach(fe => { fe.textContent = txt; });
    const zw = Math.round(Math.max(2, Math.min(100, this.depth / this.Pmax * 100))) + '%';
    document.querySelectorAll('[data-zoombar]').forEach(zb => { zb.style.width = zw; });
    this.renderer.render(this.scene, this.camera);
  }

  loop(t) {
    this._raf = requestAnimationFrame(tt => this.loop(tt));
    const dt = Math.min(0.05, (t - (this._last || t)) / 1000); this._last = t;
    this.lastTick = performance.now();
    const S = this.S;
    const hosts = document.querySelectorAll('[data-mus-host]');
    const host = hosts.length ? hosts[hosts.length - 1] : null;
    if (host && this.renderer.domElement.parentNode !== host) {
      host.appendChild(this.renderer.domElement);
      this.hostEl = host; this.resize();
    } else if (host && (host.clientWidth !== this.lastW || host.clientHeight !== this.lastH)) {
      this.hostEl = host; this.resize();
    }
    this.applyStage(true);
    this.applyDive();
    if (S.rotOn) this.cam.theta += dt * (0.12 + S.rotSpeed * 0.8);
    this.cam.rad += (this.cam.tRad - this.cam.rad) * Math.min(1, dt * 7);
    if (this.dust) this.dust.rotation.y += dt * 0.012;
    this.spreadCur += (S.spread - this.spreadCur) * Math.min(1, dt * 5);
    this.applySpread();
    if (this.ptr) this.setHover(this.hitTest());
    if (this.hover && this.ptr) document.querySelectorAll('[data-mus-tip]').forEach(tp => { tp.style.transform = 'translate(' + (this.ptr.cx + 16) + 'px,' + (this.ptr.cy - 10) + 'px)'; });
    this.renderNow();
  }

  slide(e, key) {
    const track = e.currentTarget;
    const S = this.S;
    // Rect FIGE au depart du geste. La fiche est repositionnee a chaque image d'apres son
    // ancrage 3D, et deplacer le curseur bouge la coupe, donc l'ancrage, donc la fiche.
    // Remesurer la piste a chaque mouvement creait une boucle de retour : elle sautait
    // sous le doigt et la valeur partait au hasard.
    const r = track.getBoundingClientRect();
    const move = ev => {
      S[key] = Math.max(0, Math.min(1, (ev.clientX - r.left) / (r.width || 1)));
      this.sync();
    };
    move(e);
    // Sans ca le navigateur demarre une selection de texte des qu'on sort de la piste :
    // toute la page se surligne pendant le glissement.
    e.preventDefault();
    const selAvant = document.body.style.userSelect;
    document.body.style.userSelect = 'none';
    const up = () => {
      document.body.style.userSelect = selAvant;
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  }

  renderVals() {
    const st = this.S, lv = st.level, L = this.LEV[lv];
    const set = (k, v) => { st[k] = v; this.sync(); };
    const on = c => c ? '#f9ece7' : 'rgba(244,231,227,.62)';
    const dim = c => c ? 'rgba(240,162,115,.85)' : 'rgba(244,231,227,.34)';
    const dot = c => c ? '#f0a273' : 'rgba(34,18,24,.9)';
    const V = {
      hostRef: this.hostRef, rootRef: this.rootRef, tipRef: this.tipRef, fadeRef: this.fadeRef,
      levelName: L.name.toUpperCase(), levelSize: L.size, levelTag: L.tag,
      goL1: () => this.goLevel(0), goL2: () => this.goLevel(1), goL3: () => this.goLevel(2),
      reset: () => { st.cards = []; st.resetView = (st.resetView || 0) + 1; this.sync(); },
      showRot: st.row === 'rotation', showCut: st.row === 'coupe', showSpread: st.row === 'ecart',
      rotChev: st.row === 'rotation' ? '⌄' : '›', cutChev: st.row === 'coupe' ? '⌄' : '›', spreadChev: st.row === 'ecart' ? '⌄' : '›',
      tRot: () => set('row', st.row === 'rotation' ? null : 'rotation'),
      tCut: () => set('row', st.row === 'coupe' ? null : 'coupe'),
      tSpread: () => set('row', st.row === 'ecart' ? null : 'ecart'),
      toggleRot: () => set('rotOn', !st.rotOn),
      rotLabel: st.rotOn ? Math.round(st.rotSpeed * 100) + ' %' : 'arrêt',
      rotPct: Math.round(st.rotSpeed * 100) + '%',
      rotTrack: st.rotOn ? 'rgba(240,162,115,.55)' : 'rgba(255,255,255,.12)',
      rotKnob: st.rotOn ? '18px' : '2px',
      onRotSlide: e => this.slide(e, 'rotSpeed'),
      cutLabel: L.clip ? st.cut.toFixed(2) : 'aucune',
      cutPct: Math.round(st.cut * 100) + '%',
      onCutSlide: e => this.slide(e, 'cut'),
      spreadLabel: st.spread ? 'éclaté' : 'compact',
      setCompact: () => set('spread', 0), setExploded: () => set('spread', 1),
      cpBg: st.spread ? 'transparent' : 'rgba(240,162,115,.14)', cpBr: st.spread ? 'rgba(255,255,255,.1)' : 'rgba(240,162,115,.35)', cpFg: st.spread ? 'rgba(244,231,227,.5)' : '#ffd9c0',
      exBg: st.spread ? 'rgba(240,162,115,.14)' : 'transparent', exBr: st.spread ? 'rgba(240,162,115,.35)' : 'rgba(255,255,255,.1)', exFg: st.spread ? '#ffd9c0' : 'rgba(244,231,227,.5)',
      cards: st.cards.map(id => Object.assign({ id, close: () => { st.cards = st.cards.filter(c => c !== id); this.sync(); } }, this.INFO[id]))
    };
    /* Panneau des organites du niveau courant. Ferme, il se reduit a sa poignee ;
       ouvert, il deplie sa hauteur et le contenu monte en cascade. */
    const fams = this.FAMS[lv] || [], famI = Math.min(st.odFam || 0, Math.max(0, fams.length - 1));
    const shut = !!st.odClosed;
    V.odScope = this.SCOPE[lv] || 'de ce niveau';
    V.odWidth = shut ? '470px' : 'min(700px, calc(100% - 120px))';
    V.odPadBottom = shut ? '0px' : '22px';
    V.odShadow = shut ? '0 -10px 30px rgba(0,0,0,.34)' : '0 -18px 50px rgba(0,0,0,.42)';
    V.odRows = shut ? '0fr' : '1fr';
    V.odInnerOp = shut ? '0' : '1';
    V.odRowMax = shut ? '40px' : '0px';
    V.odRowPadBottom = shut ? '12px' : '0px';
    V.odTxOp = shut ? '1' : '0';
    V.odToggle = () => { st.odClosed = !st.odClosed; this.sync(); };
    V.odFams = fams.map((f, i) => ({
      name: f.name,
      dot: (this.INFO[f.ids[0]] || {}).dot || '#f0a273',
      bg: i === famI ? 'rgba(255,255,255,.09)' : 'rgba(255,255,255,.05)',
      br: i === famI ? 'rgba(255,255,255,.22)' : 'rgba(220,170,140,.16)',
      fg: i === famI ? '#f9ece7' : 'rgba(244,231,227,.72)',
      delay: (0.08 + i * 0.035).toFixed(3) + 's',
      pick: () => { st.odFam = i; this.sync(); }
    }));
    V.odItems = ((fams[famI] || { ids: [] }).ids).filter(id => this.INFO[id]).map((id, i) => ({
      name: this.INFO[id].name,
      sub: this.INFO[id].sub,
      dot: this.INFO[id].dot,
      bg: st.cards.indexOf(id) >= 0 ? 'rgba(255,255,255,.09)' : 'rgba(255,255,255,.04)',
      delay: (0.16 + i * 0.04).toFixed(3) + 's',
      pick: () => { st.cards = st.cards.filter(c => c !== id).concat([id]).slice(-3); this.sync(); }
    }));

    /* Boutons carres du HUD : allumes quand leur reglage est ouvert. Meme logique que
       la cellule vegetale, dans la gamme rouge/orangee de la fibre. */
    const btn = (a, k) => {
      V[k + 'BtnBg'] = a ? 'rgba(240,162,115,.16)' : 'rgba(255,255,255,.05)';
      V[k + 'BtnBr'] = a ? 'rgba(240,162,115,.45)' : 'rgba(255,255,255,.11)';
      V[k + 'BtnFg'] = a ? '#f9ece7' : 'rgba(244,231,227,.55)';
    };
    (btn(V.showRot, 'rot'), btn(V.showCut, 'cut'), btn(V.showSpread, 'sp'));

    [0, 1, 2].forEach(i => {
      const a = lv === i, k = i + 1;
      V['n' + k] = a ? '#f0a273' : 'rgba(244,231,227,.4)';
      V['t' + k] = on(a);
      V['s' + k] = a ? 'rgba(240,162,115,.8)' : 'rgba(244,231,227,.36)';
      V['d' + k + 'bg'] = dot(a);
      V['d' + k + 'br'] = dim(a);
      V['d' + k + 'sh'] = a ? '0 0 12px rgba(240,162,115,.7)' : 'none';
    });
    return V;
  }
}

DC.mount(
  CelluleMusculaire,
  { autoRotate: false, cut: 0.55, spread: 'compact', particles: true },
  document.getElementById('root'),
  document.getElementById('tpl').innerHTML
);
</script>
</body>
</html>
